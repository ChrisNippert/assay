frames(p, 4, right=True)
assert p.x == 18 + 12 and p.vx == 3 and p.y == Y0 and p.on_ground, st(p)
frames(p, 2, left=True)
assert p.x == 18 + 12 - 6 and p.vx == -3, st(p)
frames(p, 3, left=True, right=True)
assert p.x == 18 + 6 and p.vx == 0, f"left and right together cancel: {st(p)}"
frames(p, 40, right=True)
assert p.x == 9 * 16 - 12 and p.y == Y0, f"walking right into the wall should stop flush against it (x = {9 * 16 - 12}): {st(p)}"
frames(p, 100, left=True)
assert p.x == 16, f"walking left into the wall should stop at x = 16: {st(p)}"

