name = "Game projects"
short = "Games"
description = "Write a small game's engine from a spec (a maze chase, falling sand, platformer physics, a match-three board, a turn-based dungeon); hidden tests play it move by move and check every detail. A realistic medium-size program, not a one-liner. Needs Python 3."
check = "code"
max_tokens = 16384

[[questions]]
id = "maze-chase"
prompt = '''
Write a Python class `MazeGame` for a small headless maze-chase game. Define everything exactly as below; hidden tests play scripted games and check the state after every tick. Only the standard library is available. Reply with one Python code block.

**Constructor.** `MazeGame(maze: str)`: rows separated by newlines (use `maze.splitlines()`), all the same length. Characters: `#` wall, `.` pellet, `o` power pellet, space empty floor, `P` the player's start, `C` a chaser's start. `P` and `C` cells are plain floor (no pellet). Rows are numbered from 0 at the top and columns from 0 at the left; a position is a tuple `(row, col)`. Anything outside the map counts as a wall (no wrap-around). The chasers are numbered 0, 1, 2… in reading order (row by row, left to right).

**State** (plain attributes, always up to date): `player` (a position), `chasers` (a list of positions, index = chaser number), `score` (starts 0), `lives` (starts 3), `tick` (starts 0), `frightened` (ticks of fright left, starts 0), `state` (`"playing"`, `"won"` or `"lost"`), and `pellets_left` (the number of `.` and `o` still on the map; it may be an attribute or a property).

**`step(direction)`** advances one tick and returns `self.state`. `direction` is `"U"`, `"D"`, `"L"`, `"R"` or `None` (stand still). If `state` is not `"playing"`, `step` does nothing at all (not even `tick`) and returns the state. Otherwise, in this order:

1. `tick` goes up by 1.
2. The player moves one cell in `direction` unless that cell is a wall (then the player stays; `tick` still counted). A pellet on the cell the player is now on is eaten: `.` gives 10 points, `o` gives 50 points, sets `frightened` to 8 and resets the ghost-eating combo counter to 0. If that leaves `pellets_left == 0` the state becomes `"won"` and the tick ends immediately (nothing below happens).
3. Collision check (below).
4. Every chaser moves once, in index order, one at a time (they may share cells and pass through each other); the movement rule is below.
5. Collision check again.
6. If `frightened > 0`, it goes down by 1. (So a power pellet eaten on tick t makes chasers frightened for the collision checks and moves of ticks t … t+7.)

**Collision check.** Go through the chasers in index order; each chaser standing on the player's cell is handled. While `frightened > 0` the chaser is eaten: the score goes up by `200 * 2**combo` and `combo` goes up by 1 (so 200, 400, 800… until the next power pellet resets it), and that chaser goes back to its start cell with no heading (below). Otherwise the player is caught: `lives` goes down by 1; if it is now 0 the state becomes `"lost"`; otherwise the player and every chaser go back to their start cells, every heading is cleared and `frightened` is set to 0. A catch ends the tick at once (no later step of that tick happens, including step 6) and the rest of the collision loop is skipped.

**Chaser movement.** Each chaser remembers its heading: the direction (`"U"`, `"L"`, `"D"` or `"R"`) of its last move, or none at the start and after going back to its start cell. To move: the candidate directions are those, taken in the fixed priority order U, L, D, R, whose neighbouring cell is not a wall. If the chaser has a heading, the direction opposite to it is dropped from the candidates unless it is the only candidate (a dead end). With no candidates the chaser stays. Let `dist(cell)` be the length of the shortest 4-connected path over non-wall cells from `cell` to the player's current position (10**9 if there is none). A normal chaser (`frightened == 0` at that moment) takes the candidate whose neighbouring cell has the smallest `dist`; a frightened one takes the largest `dist`. Ties go to the candidate that comes first in the order U, L, D, R. The chaser moves there and its heading becomes that direction. All chasers use the player's position as it is at that moment (after step 2).'''
tests = '''
def snap(g):
    return (tuple(g.player), [tuple(c) for c in g.chasers], g.score, g.lives, g.frightened, g.state)

# --- start state
g = MazeGame("#######\n#P.o.C#\n#.###.#\n#.....#\n#######")
assert tuple(g.player) == (1, 1), f"player start {g.player}"
assert [tuple(c) for c in g.chasers] == [(1, 5)], f"chaser start {g.chasers}"
assert (g.score, g.lives, g.tick, g.frightened, g.state, g.pellets_left) == (0, 3, 0, 0, "playing", 10), \
    f"initial (score, lives, tick, frightened, state, pellets_left) wrong: {(g.score, g.lives, g.tick, g.frightened, g.state, g.pellets_left)}"

# --- walls, pellets, ticks
g = MazeGame("#########\n#P.o....#\n#.#######\n#.......C#\n#########")
assert g.step("U") == "playing" and tuple(g.player) == (1, 1) and g.tick == 1, "walking into a wall must leave the player in place but still count the tick"
g.step("L")
assert tuple(g.player) == (1, 1), "the map's left edge is a wall"
g.step(None)
assert tuple(g.player) == (1, 1) and g.tick == 3
g.step("R")
assert tuple(g.player) == (1, 2) and g.score == 10 and g.pellets_left == 13, f"eating a pellet: score {g.score}, left {g.pellets_left}"
g.step("L")
assert tuple(g.player) == (1, 1) and g.score == 10, "an eaten pellet must not be eaten twice"
g.step("R")
g.step("R")
assert g.score == 60 and g.frightened == 7 and g.pellets_left == 12, f"power pellet: score {g.score}, frightened {g.frightened}, left {g.pellets_left}"

# --- a chaser walks straight at a standing player and catches it on tick 7
g = MazeGame("##########\n#C......P.#\n##########")
for t in range(1, 7):
    g.step(None)
    assert [tuple(c) for c in g.chasers] == [(1, 1 + t)], f"tick {t}: chaser at {g.chasers}, expected (1, {1 + t})"
    assert g.lives == 3
g.step(None)
assert g.lives == 2 and tuple(g.player) == (1, 8) and [tuple(c) for c in g.chasers] == [(1, 1)] and g.state == "playing", \
    f"after being caught: {snap(g)} (expected the player and chaser back at their starts, 2 lives)"
assert g.tick == 7

# --- tie-break order U, L, D, R on a ring
g = MazeGame("#####\n#C..#\n#.#.#\n#..P#\n#####")
seen = []
for t in range(3):
    g.step(None)
    seen.append(tuple(g.chasers[0]))
assert seen == [(2, 1), (3, 1), (3, 2)], f"with two equally short routes the chaser takes the first direction in the order U, L, D, R: {seen}"
g.step(None)
assert g.lives == 2 and snap(g)[1] == [(1, 1)], f"the chaser should reach the player on tick 4: {snap(g)}"

# --- frightened chaser flees, reverses only at a dead end, is eaten for 200 then 400
g = MazeGame("############\n#Po.....C.#\n############")
exp = [  # after each R: player col, chaser col, score, frightened
    (2, 9, 50, 7), (3, 8, 60, 6), (4, 7, 70, 5), (5, 6, 80, 4),
    (6, 9, 290, 3), (7, 8, 300, 2), (8, 7, 700, 1),
]
for i, (pc, cc, sc, fr) in enumerate(exp, 1):
    g.step("R")
    got = (g.player[1], g.chasers[0][1], g.score, g.frightened)
    assert got == (pc, cc, sc, fr), f"tick {i}: (player col, chaser col, score, frightened) = {got}, expected {(pc, cc, sc, fr)}"
assert g.state == "playing" and g.lives == 3
assert g.step("R") == "won" and g.score == 710 and g.pellets_left == 0, f"winning: {snap(g)}"
t0 = g.tick
assert g.step("L") == "won" and g.tick == t0 and tuple(g.player) == (1, 9), "after the game ends step() must change nothing"

# --- fright lasts exactly 8 ticks (the tick of the pellet included), then the chaser hunts again
g = MazeGame("#############\n#.Po.......C#\n#.###########\n#...........#\n#############")
g.step("R")
assert g.frightened == 7 and g.score == 50, f"{snap(g)}"
for k in range(6, -1, -1):
    g.step(None)
    assert g.frightened == k, f"frightened should count down to 0, got {g.frightened} expecting {k}"
# the chaser fled while frightened; the next ticks it must come back towards the player
col = g.chasers[0][1]
g.step(None)
g.step(None)
assert g.chasers[0][1] < col or tuple(g.chasers[0]) != (1, col), f"chaser should chase again after fright: {snap(g)}"

# --- a power pellet eaten while frightened resets the timer and the combo
g = MazeGame("###############\n#PooC.........#\n###############")
g.step("R")
assert g.frightened == 7
g.step(None)
g.step(None)
assert g.frightened == 5, g.frightened
g.step("R")
assert g.frightened == 7 and g.score == 100, f"second power pellet: frightened {g.frightened}, score {g.score}"

# --- the combo restarts at 200 with every power pellet (a map may be a single row)
g = MazeGame("#PoC.o..#")
g.step("L")
assert [tuple(c) for c in g.chasers] == [(0, 2)], f"tick 1: {snap(g)}"
g.step("R")
assert g.score == 250 and [tuple(c) for c in g.chasers] == [(0, 4)] and g.frightened == 7, \
    f"tick 2: stepping onto a power pellet and a chaser in the same move: {snap(g)} (expected score 50 + 200 and the chaser sent home, then fleeing to column 4)"
for _ in range(4):
    g.step("R")
assert g.score == 520 and g.state == "playing" and g.lives == 3, f"the second ghost after a new power pellet is worth 200 again: {snap(g)}"

# --- a catch in step 3 ends the tick: nobody moves afterwards
g = MazeGame("#########\n#PC.C.. #".replace(" #", "#"))
g.step("R")
assert g.lives == 2 and tuple(g.player) == (0 + 1, 1) and [tuple(c) for c in g.chasers] == [(1, 2), (1, 4)], \
    f"after the player walks into a chaser everyone is back at the start and nobody moves that tick: {snap(g)}"

# --- equal distances: the first of U, L, D, R wins
room = ["#######", "#.....#", "#.....#", "#.....#", "#.....#", "#######"]
r1 = list(room); r1[1] = "#..C..#"; r1[3] = "#P....#"   # chaser (1,3), player (3,1): L and D tie
g = MazeGame("\n".join(r1)); g.step(None)
assert tuple(g.chasers[0]) == (1, 2), f"L comes before D: {snap(g)}"
r2 = list(room); r2[3] = "#C....#"; r2[1] = "#..P..#"   # chaser (3,1), player (1,3): U and R tie
g = MazeGame("\n".join(r2)); g.step(None)
assert tuple(g.chasers[0]) == (2, 1), f"U comes before R: {snap(g)}"

# --- lost game
g = MazeGame("#####\n#PC.#\n#####")
res = [g.step(None) for _ in range(3)]
assert res == ["playing", "playing", "lost"], f"three catches should lose the game: {res} {snap(g)}"
assert g.lives == 0 and g.tick == 3
assert g.step("R") == "lost" and g.tick == 3

# --- full scripted games (state checked every 8 ticks)
BIG = """###############
#o...#.....#..#
#.##.#.###.#.##
#.#....#C#...##
#.#.##.# #.##.#
#...#..#.#..o.#
###.#.##.#.##.#
#P......C#....#
###############"""
GAMES = [
    ('RRUUUURUULLLDDDDRRDDRRUURUUUURRRRDNRRULUUURRRUURRRRDDDDDDRRRUULLRRUDLLLUURRUURUNNNNNNNNNNNNRNNNNN',
     [(8, (2, 4), ((6, 5), (4, 3)), 80, 3, 0, 'playing'), (16, (5, 1), ((1, 8), (2, 1)), 200, 3, 3, 'playing'),
      (24, (5, 5), ((7, 10), (7, 4)), 250, 3, 0, 'playing'), (32, (1, 9), ((5, 10), (1, 6)), 330, 3, 0, 'playing'),
      (40, (5, 3), ((7, 7), (7, 3)), 350, 2, 0, 'playing'), (48, (1, 7), ((2, 6), (2, 6)), 360, 2, 0, 'playing'),
      (56, (6, 10), ((4, 10), (4, 10)), 400, 2, 0, 'playing'), (64, (5, 11), ((5, 13), (5, 13)), 520, 2, 6, 'playing'),
      (72, (4, 10), ((7, 6), (5, 8)), 1130, 2, 0, 'playing'), (80, (1, 13), ((1, 6), (5, 6)), 1180, 2, 0, 'playing'),
      (88, (1, 13), ((3, 12), (1, 10)), 1180, 2, 0, 'playing'), (96, (7, 2), ((7, 7), (7, 3)), 1180, 1, 0, 'playing'),
      (97, (7, 2), ((7, 6), (7, 2)), 1180, 0, 0, 'lost')]),
    ('RRUUUURUULLLDDDDRRDDRRUURUUUURRRRDNDDRRUUUURRRDDLDDRRRUUUNRRUUUURRRUURRRRDDDDDDRRRUUUDLLLUURRUUR',
     [(8, (2, 4), ((6, 5), (4, 3)), 80, 3, 0, 'playing'), (16, (5, 1), ((1, 8), (2, 1)), 200, 3, 3, 'playing'),
      (24, (5, 5), ((7, 10), (7, 4)), 250, 3, 0, 'playing'), (32, (1, 9), ((5, 10), (1, 6)), 330, 3, 0, 'playing'),
      (40, (6, 3), ((7, 7), (7, 3)), 350, 2, 0, 'playing'), (48, (5, 6), ((3, 3), (4, 6)), 360, 2, 0, 'playing'),
      (56, (5, 8), ((7, 5), (6, 8)), 400, 2, 0, 'playing'), (64, (3, 3), ((7, 6), (6, 3)), 400, 1, 0, 'playing'),
      (72, (1, 9), ((1, 6), (1, 6)), 400, 1, 0, 'playing'), (80, (7, 11), ((5, 10), (5, 10)), 460, 1, 0, 'playing'),
      (88, (5, 11), ((4, 13), (4, 13)), 570, 1, 6, 'playing'), (96, (1, 13), ((6, 10), (6, 10)), 620, 1, 0, 'won')]),
]
for moves, cps in GAMES:
    g = MazeGame(BIG)
    for i, ch in enumerate(moves, 1):
        g.step(None if ch == "N" else ch)
        for cp in cps:
            if cp[0] == i:
                got = snap(g)
                want = (cp[1], [tuple(x) for x in cp[2]], cp[3], cp[4], cp[5], cp[6])
                assert got == want, f"tick {i} of a scripted game: (player, chasers, score, lives, frightened, state) = {got}, expected {want}"

# --- speed: 30x30 open room, 4 chasers, 1000 ticks
import time
rows = ["#" * 30] + ["#" + "." * 28 + "#" for _ in range(28)] + ["#" * 30]
rows[1] = "#P" + "." * 26 + "C#"
rows[28] = "#C" + "." * 26 + "C#"
rows[14] = rows[14][:15] + "C" + rows[14][16:]
g = MazeGame("\n".join(rows))
t = time.time()
for i in range(1000):
    g.step("RRDDLLUU"[i % 8])
    if g.state != "playing":
        break
assert time.time() - t < 8, "step() is too slow: use one breadth-first search per tick"
'''

[[questions]]
id = "falling-sand"
prompt = '''
Write a Python class `Sandbox` for a falling-sand toy simulation on a rectangular grid. Define everything exactly as below; hidden tests step the simulation and compare the whole grid after each step. Only the standard library is available. Reply with one Python code block.

**Constructor.** `Sandbox(rows: list[str])`: all rows have the same length. Characters: `.` empty, `#` stone, `s` sand, `w` water. Row 0 is the top. The constructor must not modify the list it is given.

**Methods.** `rows()` returns the current grid as a new list of strings (changing the returned list must not affect the simulation). `count(ch)` returns how many cells hold `ch`. `step()` advances one tick. The attribute `generation` is the number of `step()` calls so far (starts at 0). Outside the grid counts as solid: nothing can move there.

**One tick.** Let `pref` be +1 (right) when `generation` is even and -1 (left) when it is odd, using the value from before this tick's increment; `generation` goes up by 1 at the end of the tick. Visit the cells row by row from the bottom row up to row 0; within a row, visit the columns left to right when `pref` is +1 and right to left when `pref` is -1. For each visited cell that holds sand or water and has not already moved during this tick, apply the matching rule once, using the grid as it is at that moment (earlier moves of this same tick are already in it). Stone never moves. A particle that moves, and the water that a sinking grain of sand swaps places with, counts as moved for the rest of the tick: it is skipped if the visit reaches its new cell later. (A grain of sand may still sink into water that has already moved this tick.)

*Sand* at (r, c), in this order, takes the first option that applies:
1. If the cell below, (r+1, c), is empty or holds water, move down. When it held water the two swap: the water goes to (r, c).
2. Otherwise, for dx in (pref, -pref): if (r+1, c+dx) exists and is empty, move there. (Only empty cells count for diagonal moves. The neighbouring cell (r, c+dx) does not matter.)
3. Otherwise stay.

*Water* at (r, c), in this order:
1. If (r+1, c) is empty, move down.
2. Otherwise, for dx in (pref, -pref): if (r+1, c+dx) is empty, move there.
3. Otherwise, for dx in (pref, -pref): if (r, c+dx) is empty, move there.
4. Otherwise stay.

Water never displaces anything except by being sunk through by sand as described, and a water particle may swap upward only that way. Sand and water counts, and the position of every stone, never change.'''
tests = '''
def run(rows, n):
    s = Sandbox(rows)
    for _ in range(n):
        s.step()
    return s

def same(got, want, msg):
    assert got == want, msg + "\n  got:\n    " + "\n    ".join(got) + "\n  expected:\n    " + "\n    ".join(want)

# --- basics: input untouched, rows() is a copy, counts, generation
src = ["..s.", "w.#.", "...."]
s = Sandbox(src)
assert src == ["..s.", "w.#.", "...."], "the constructor's argument must not be modified"
assert s.rows() == src and s.count("s") == 1 and s.count("w") == 1 and s.count("#") == 1 and s.count(".") == 9
assert s.generation == 0
s.rows()[0] = "XXXX"
assert s.rows() == src, "rows() must return a copy"
s.step()
assert s.generation == 1 and src == ["..s.", "w.#.", "...."]

# --- a grain falls one row per tick and stops on the floor
s = Sandbox(["..s..", ".....", ".....", "....."])
for k in range(1, 6):
    s.step()
    r = min(k, 3)
    want = ["....." for _ in range(4)]
    want[r] = "..s.."
    same(s.rows(), want, f"after {k} ticks a lone grain should be in row {r}")

# --- a stack falls as a unit (rows are visited bottom to top)
same(run(["..s..", "..s..", "..s..", ".....", ".....", "#####"], 1).rows(),
     [".....", "..s..", "..s..", "..s..", ".....", "#####"], "a column of sand must fall together")
same(run(["..s..", "..s..", "..s..", ".....", ".....", "#####"], 3).rows(),
     [".....", ".....", ".....", "..s..", "..ss.", "#####"], "after 3 ticks the third grain slides off to the right (generation 2 prefers right)")

# --- preference alternates: right on even generations, left on odd ones
same(run([".....s.....", ".....#.....", "...........", "###########"], 1).rows(),
     ["...........", ".....#s....", "...........", "###########"], "generation 0: sand on a pillar slides down-right")
same(run([".s.", "...", ".#.", "###"], 2).rows(),
     ["...", "...", "s#.", "###"], "generation 1: sand on a pillar slides down-left")
same(run(["...s...", "...s...", ".......", ".......", "#######"], 3).rows(),
     [".......", ".......", ".......", "...ss..", "#######"], "second grain lands to the right of the first")

# sand slides diagonally only into empty cells
same(run([".s.", "w#w", "###"], 1).rows(), [".s.", "w#w", "###"], "sand does not move diagonally into water")
same(run([".s.", ".#.", "###"], 1).rows(), ["...", ".#s", "###"], "generation 0 prefers the right diagonal")
same(run(["s.", "#.", "##"], 1).rows(), ["..", "#s", "##"], "sand at the left edge uses the right diagonal")
same(run([".s", ".#", "##"], 1).rows(), ["..", "s#", "##"], "the right diagonal is outside the grid, so it goes left")

# --- sand sinks through water by swapping
s = Sandbox(["s", "w", "#"])
s.step()
same(s.rows(), ["w", "s", "#"], "sand swaps with the water below it")
s.step()
same(s.rows(), ["w", "s", "#"], "and then rests")
same(run(["s.", "w#", "##"], 1).rows(), ["w.", "s#", "##"], "sand sinks through the water, which ends up where the sand was")
same(run(["..w..", "..w..", "..s..", ".....", "wwwww", "#####"], 4).rows(),
     [".....", ".....", ".....", "ww..w", "wwsww", "#####"], "sand sinking through a pool with water falling after it (4 ticks)")
# live grid: water that slid under the sand earlier in the same tick is sunk through
same(run(["s..", ".w#", "###"], 1).rows(), ["w..", "s.#", "###"], "the grid is updated as the tick goes: water moved sideways under the sand, and the sand sinks through it")

# --- water
same(run(["w...", "####"], 1).rows(), [".w..", "####"], "a particle that moved is not moved again in the same tick, even though the scan reaches its new cell")
same(run(["w...", "####"], 2).rows(), ["w...", "####"], "generation 1 prefers left")
same(run(["..w..", ".....", "#####"], 2).rows(), [".....", ".w...", "#####"], "water falls, then slides left (generation 1)")
same(run([".w.", "#.#", "###"], 1).rows(), ["...", "#w#", "###"], "water falls straight down when it can")
same(run(["w.", "##", "##"], 1).rows(), [".w", "##", "##"], "water on a ledge slides right at generation 0")
same(run([".w", "#.", "##"], 1).rows(), ["..", "#w", "##"], "water falls before it slides")
same(run(["w#", ".#"], 1).rows(), [".#", "w#"], "water falls")

# --- noise in the golden grid
START = ['w.w...s.s.w.s#', '..ws.s#.s#s.sw', 'w.ss..ssss.ws.', 'sss#..w#ss..w.', 'ww.ww..w..ws..', 's...w#..#w#w..', '.sws.s.w.w....', 'ww..#.sw.wwsw.', '##..#....#.##.', '..#..##...##..', '.#...#.....##.', '#...........#.']
GOLD = {
    1: ['.............#', 'w.w...#ss#w.s.', '..ws.s..s.s.sw', 'w.s#s.s#sssws.', 'sss...w.ss.ww.', 'ww.ww#.w#.#s..', 's...w....w.w..', 'wsws#s.w.wws..', '##w.#.sw.#w##w', '..#..##...##..', '.#...#.....##.', '#...........#.'],
    2: ['.............#', '......#..#....', 'w.w....ss.w.s.', '.ws#.s.#s.s.sw', 'wws.s.s.sssws.', 'sss..#ws#s#ww.', 'ww.ww..w...s..', 'ss.w#....www..', '##ws#ssww#s##.', '.w#..##w.w##.w', '.#...#.....##.', '#...........#.'],
    5: ['.............#', '......#..#....', '..............', '...#...#......', '.w.......s..w.', 'wwww.#.s#s#ws.', 'wws.s..s.s..sw', 'sss.#ssw.swss.', '##ss#.ws.#s##w', '..#ww##wws##.w', '.#sww#..wsw##.', '#..ss..swww.#w'],
    40: ['.............#', '......#..#....', '..............', '...#...#......', '..............', '.....#..#.#...', '.ww......w.w..', 'swww#www.swssw', '##ss#wssw#s##w', '.s#sw##sws##ww', 's#wss#wsssw##s', '#wssswwsssww#s'],
}
s = Sandbox(START)
for n in range(1, 41):
    s.step()
    if n in GOLD:
        same(s.rows(), GOLD[n], f"busy grid after {n} ticks")

# --- conservation on bigger random grids
import random
rnd = random.Random(11)
rows = ["".join(rnd.choice("....ssswwww#") for _ in range(40)) for _ in range(30)]
s = Sandbox(rows)
before = {ch: s.count(ch) for ch in "sw#."}
stones = {(r, c) for r, row in enumerate(rows) for c, ch in enumerate(row) if ch == "#"}
for _ in range(60):
    s.step()
now = s.rows()
assert {ch: s.count(ch) for ch in "sw#."} == before, "particles must be neither created nor destroyed"
assert {(r, c) for r, row in enumerate(now) for c, ch in enumerate(row) if ch == "#"} == stones, "stone must never move"
assert all(len(r) == 40 for r in now) and len(now) == 30

# --- speed: 100x100 grid, 60 ticks
import time
rnd = random.Random(3)
big = ["".join(rnd.choice("..sw#") for _ in range(100)) for _ in range(100)]
s = Sandbox(big)
t = time.time()
for _ in range(60):
    s.step()
assert time.time() - t < 6, "step() is too slow for a 100x100 grid"
