assert (p.x, p.y) == (18, Y0), f"start position {(p.x, p.y)}: the box's left is the tile's left + 2 and its bottom is the tile's bottom"
assert p.on_ground is True and p.vx == 0 and p.vy == 0 and not p.dead and not p.won and p.frames == 0
frames(p, 5)
assert (p.x, p.y) == (18, Y0) and p.on_ground and p.vy == 0 and p.frames == 5, f"standing still must stay put: {st(p)} frames {p.frames}"

# --- walking: 3 px per frame, both keys cancel, walls stop it flush
