id = "match-three"
prompt = '''
Write a Python class `Match3` for the rules of a match-three tile puzzle (swap neighbouring tiles, matches vanish, the rest fall, new tiles drop in). It is headless and deterministic: new tiles come from a fixed string. Define everything exactly as below; hidden tests play many moves and compare the score and the whole board. Only the standard library is available. Reply with one Python code block.

**Constructor.** `Match3(rows: list[str], refill: str)`: `rows` is a rectangular board of tile letters (any characters), row 0 on top; `refill` is a non-empty string of new tiles, used in order and wrapping round to its start when used up. The board handed in has no match yet; the constructor does not resolve anything. Attributes: `score` (0), `moves` (0, the number of accepted swaps) and `refill_pos` (0; the total number of refill letters used so far, not wrapped).

**Matches.** A run is a maximal horizontal or vertical line of 3 or more equal letters.

**`swap(r1, c1, r2, c2) -> int`.** Swaps the tiles at two cells if the swap is allowed, then resolves the board, and returns the points gained by this swap. A swap is allowed only if both cells are on the board, they are next to each other (same row and neighbouring columns, or same column and neighbouring rows), and after exchanging them the board contains at least one run (anywhere). Otherwise `swap` returns -1 and nothing at all changes (board, `score`, `moves`, `refill_pos`).

After an allowed swap, repeat these rounds, numbering them k = 1, 2, 3… until no run is left:
1. Find all runs. The cells to clear are all cells that belong to at least one run (a cell in a horizontal and a vertical run counts once). The round is worth `k * (10 * C + 20 * E)` points, where `C` is the number of cells cleared and `E` is the sum over all runs of (length - 3), counting a horizontal and a vertical run separately.
2. Clear those cells. In every column the tiles that are left fall straight down, keeping their order, to rest on the bottom or on each other. Then fill each column's empty cells at its top with new tiles: go through the columns from left to right, and within a column fill the empty cells from the lowest one up to row 0, taking letters from `refill` one by one (the first letter used goes to the lowest empty cell of the leftmost column that needs tiles).

The points of all rounds are added to `score` and returned, and `moves` goes up by one.

**Other methods.** `board()` returns the current board as a new list of strings. `find_move()` returns the first allowed swap as a tuple `(r1, c1, r2, c2)`, or `None` if there is none; it looks at the cells in reading order (row by row, left to right) and for each cell tries the swap with its right neighbour first and then the swap with the neighbour below it. `has_moves()` returns whether `find_move()` finds one. Neither changes the board or any counter.'''
tests = '''
def show(rows):
    return "\n    ".join(rows)

def same(got, want, msg):
    assert got == want, msg + "\n  got:\n    " + show(got) + "\n  expected:\n    " + show(want)

B = ["ABAB",
     "BABA",
     "CDCD",
     "DCDC"]

# --- the first valid swap in reading order
m = Match3(B, "EFGHEF")
assert m.find_move() == (0, 1, 1, 1), f"find_move should return the first valid swap (cells in reading order, right neighbour before lower): {m.find_move()}"
assert m.has_moves() is True
assert m.score == 0 and m.moves == 0 and m.refill_pos == 0
same(m.board(), B, "find_move must not change the board")
m.board()[0] = "XXXX"
same(m.board(), B, "board() must return a copy")

# --- a swap that clears two rows (a three of A's and a three of B's): 6 cells x 10 points
m = Match3(B, "EFGHEF")
pts = m.swap(0, 1, 1, 1)
assert pts == 60, f"clearing 6 cells in the first round is worth 60, got {pts}"
same(m.board(), ["FHFB", "EGEA", "CDCD", "DCDC"],
     "after clearing, columns 0-2 are refilled from the sequence: the lowest empty cell of the leftmost column gets the first letter, then upwards, then the next column")
assert (m.score, m.moves, m.refill_pos) == (60, 1, 6)

# --- rejected swaps change nothing and return -1
m = Match3(B, "EFGHEF")
for args, why in [((0, 0, 0, 1), "swap that makes no match"), ((0, 0, 1, 1), "diagonal cells"), ((0, 0, 0, 2), "cells two apart"),
                  ((-1, 0, 0, 0), "outside the board"), ((3, 3, 3, 4), "outside the board"), ((0, 0, 0, 0), "a cell with itself"),
                  ((2, 0, 3, 0), "swap that makes no match")]:
    assert m.swap(*args) == -1, f"{why}: swap{args} should return -1"
same(m.board(), B, "rejected swaps must leave the board alone")
assert (m.score, m.moves, m.refill_pos) == (0, 0, 0)
# a diagonal or distant swap is rejected even when it would make a match
m3 = Match3(["XAB", "XXD", "EFG"], "HIJK")
assert m3.swap(2, 0, 1, 1) == -1, "diagonal swaps are not allowed, even when they would make a match"
assert m3.swap(2, 0, 0, 0) == -1 and m3.board() == ["XAB", "XXD", "EFG"]
# swapping two equal letters changes nothing, so it is not a match
m2 = Match3(["AAB", "CDC", "DCD"], "E")
assert m2.swap(0, 0, 0, 1) == -1

# --- a cascade: the refill makes a second match, worth double
m = Match3(B, "EFEGEH")
pts = m.swap(0, 1, 1, 1)
assert pts == 120, f"60 for the first round and 2 x 30 for the cascade: got {pts}"
same(m.board(), ["EFEB", "FGHA", "CDCD", "DCDC"], "after the cascade (the sequence wraps around)")
assert (m.score, m.refill_pos) == (120, 9)

# --- an L/T shape clears each cell once; two runs of three give no bonus
T = ["CDADC",
     "DCACD",
     "CABAC",
     "DCADD",
     "CDCDC"]
m = Match3(T, "EFGHEFGH")
pts = m.swap(2, 2, 3, 2)
assert pts == 50, f"5 cells in one round = 50 points (a cell shared by two runs counts once): got {pts}"
same(m.board(), ["CEHEC", "DDGDD", "CCFCC", "DCBDD", "CDCDC"], "T-shaped clear, refill column by column")
assert m.refill_pos == 5

# --- runs longer than three give 20 per extra tile
m = Match3(["AABAC", "CDADA", "DCDCD"], "EFGH")
assert m.swap(0, 2, 1, 2) == 60, "a run of 4: 4 x 10 + 20"
same(m.board(), ["EFGHC", "CDBDA", "DCDCD"], "four cleared in the top row")
m = Match3(["AABAA", "CDADC", "DCDCD"], "EFGHE")
assert m.swap(0, 2, 1, 2) == 90, "a run of 5: 5 x 10 + 40"
assert m.score == 90

# --- no moves left
S = ["ABAB", "CDCD", "ABAB", "CDCD"]
m = Match3(S, "E")
assert m.find_move() is None and m.has_moves() is False

# --- a vertical clear: the column keeps its remaining tile at the bottom and is refilled from the lowest empty cell up
m = Match3(["ABC", "ABD", "DCA", "CBA"], "EFGHIJKL")
assert m.swap(2, 1, 3, 1) == 30, "a vertical three is worth 30"
same(m.board(), ["AGC", "AFD", "DEA", "CCA"], "refill order within a column is bottom to top")
assert (m.score, m.moves, m.refill_pos) == (30, 1, 3)

# --- a long scripted game: points of each of 40 moves (cascades included) and checkpoints
