prompt = '''
Write a Python class `Platformer` for the physics of a tile-based platform game, in whole pixels (integers only; y grows downward). Define everything exactly as below; hidden tests feed it key sequences and check the position after frames. Only the standard library is available. Reply with one Python code block.

**Level.** `Platformer(level: list[str])`: one string per row, row 0 on top; a tile is 16 x 16 pixels, tile (col, row) covers x from 16*col to 16*col+16 and y from 16*row to 16*row+16. `#` is solid, `G` is a goal tile (not solid), `@` marks the start (empty tile) and anything else is empty. Beyond the left edge, the right edge (the width is the longest row) and the top edge of the map everything is solid; below the last row it is empty air. A row shorter than the width counts as empty for the missing tiles.

**Player.** An axis-aligned box 12 pixels wide and 14 tall. Attributes: `x`, `y` (the box's top-left corner), `vx`, `vy`, `on_ground`, `dead`, `won`, `frames`. At the start `x = 16*col + 2` and `y = 16*(row+1) - 14` for the `@` tile (the box stands in the tile's bottom, 2 pixels in from its left side), `vx = vy = 0`, `frames = 0`, `dead = won = False`, and `on_ground` is computed as described below. Two boxes overlap only if they share area; touching edges do not overlap.

**`update(left=False, right=False, jump=False)`** is one frame. If `dead` or `won` it does nothing at all. Otherwise, in this order:
1. `frames += 1`.
2. `vx = -3` if `left` and not `right`; `+3` if `right` and not `left`; else `0`.
3. If `jump` and `on_ground` (the value from the end of the previous frame): `vy = -12`. Otherwise, if `jump` is not held and `vy < -4`: `vy = -4`.
4. Gravity: `vy = min(vy + 1, 40)`.
5. Move horizontally by `vx` pixels, then vertically by `vy` pixels (in that order). Each move goes as far as it can in that direction without the box overlapping a solid tile, and stops flush against it (so it can never skip over a thin tile, however fast it is). If the vertical move was stopped by a tile (up or down), `vy` becomes 0. `vx` keeps the value from step 2 even if the move was blocked.
6. `on_ground` becomes True if the box moved down by one pixel would overlap a solid tile, else False.
7. If the box now overlaps any `G` tile, `won` becomes True. Otherwise, if `y >= 16 * (number of rows)` (the top of the box is at or below the bottom edge of the map), `dead` becomes True.'''
tests = '''
def st(p):
    return (p.x, p.y, p.vx, p.vy, p.on_ground)

def frames(p, n, left=False, right=False, jump=False):
    for _ in range(n):
        p.update(left, right, jump)

ROOM = [
    "##########",
    "#........#",
    "#........#",
    "#........#",
    "#........#",
    "#........#",
    "#........#",
    "#@.......#",
    "##########",
]
Y0 = 8 * 16 - 14  # standing on the floor: 114

# --- start
