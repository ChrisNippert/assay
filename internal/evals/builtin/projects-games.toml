ys = []
for _ in range(23):
    p.update(False, False, True)
    ys.append(p.y)
    assert p.dead is False
rise = [Y0 - sum(range(11, 11 - k, -1)) for k in range(1, 12)]
assert ys[:11] == rise, f"rising: y after each frame should be {rise}, got {ys[:11]}"
assert ys[11] == Y0 - 66, f"the apex is 66 px up and lasts a frame: {ys[9:13]}"
fall = [Y0 - 66 + sum(range(1, k + 1)) for k in range(1, 12)]
assert ys[12:23] == fall, f"falling: expected {fall}, got {ys[12:23]}"
assert ys[22] == Y0 and p.on_ground and p.vy == 11, f"back on the floor after 23 frames: {st(p)}"
p.update(False, False, True)  # jump is still held: it jumps again
assert p.vy == -11 and p.y == Y0 - 11, f"holding jump on the floor jumps again: {st(p)}"

# --- a tapped jump is shorter: after the key is released an upward speed is cut to 4
