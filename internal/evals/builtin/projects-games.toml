# --- speed: 100x100 open level with 40 monsters, 400 turns
import random, time
rnd = random.Random(8)
rows = ["#" * 100] + ["#" + "".join("#" if rnd.random() < 0.05 else "." for _ in range(98)) + "#" for _ in range(98)] + ["#" * 100]
rows = [list(r) for r in rows]
rows[50][50] = "@"
placed = 0
while placed < 40:
    x, y = rnd.randint(30, 70), rnd.randint(30, 70)
    if rows[y][x] == ".":
        rows[y][x] = "g" if placed % 2 else "O"
        placed += 1
d = Dungeon(["".join(r) for r in rows], [3, 1, 4, 1, 5, 6, 2])
t = time.time()
for i in range(400):
    d.act("NESW"[i % 4] if i % 3 else None)
    if d.state != "playing":
        break
assert time.time() - t < 6, "act() is too slow: compute the field of view once per turn"
