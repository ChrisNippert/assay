        row.append(rnd.choice([x for x in "ABCDEF" if x not in bad]))
    grid.append(row)
rows = ["".join(r) for r in grid]
assert not has_run(rows)
refill = "".join(rnd.choice("ABCDEF") for _ in range(101))
m = Match3(rows, refill)
t = time.time()
total = 0
done = 0
for i in range(200):
    mv = m.find_move()
    if mv is None:
        break
    pts = m.swap(*mv)
    assert pts > 0
    total += pts
    done += 1
    assert not has_run(m.board()), f"move {i + 1}: the board still has a run after the swap: {m.board()}"
assert done >= 100 and m.score == total and m.moves == done, f'{done} moves, score {m.score} vs {total}'
assert time.time() - t < 8, "too slow on a 20x20 board"
'''

[[questions]]
id = "dungeon-turns"
prompt = '''
Write a Python class `Dungeon` for one level of a turn-based dungeon crawler: a player, monsters that wake up when they are seen, line-of-sight, and combat whose dice come from a list you are given. Define everything exactly as below; hidden tests play scripted turns and check positions, hit points, the monsters and how many dice were used. Only the standard library is available. Reply with one Python code block.

**Constructor.** `Dungeon(rows: list[str], rolls: list[int])`: `rows` is the map, all rows the same length, row 0 on top. Characters: `#` wall, `.` floor, `@` the player's start, `g` a goblin, `O` an ogre, `!` a healing potion, `>` the stairs; the cells under `@`, `g` and `O` are plain floor, and `!` and `>` are floor with an item. A position is `(x, y)` = (column, row). Outside the map counts as wall. `rolls` is a non-empty list of die results (1 to 6); every attack (the player's or a monster's, hit or miss) takes the next one, in order, and when the list is used up it starts again from the beginning.

**State.** `pos` (the player's position), `hp` (starts 20; it is also the maximum), `state` (`"playing"`, `"won"` or `"dead"`), `turn` (0), `kills` (0) and `rolls_used` (0, the total number of dice taken, not wrapped). `monsters()` returns a list of `(kind, x, y, hp)` tuples, one per living monster, in the order the monsters appear in the map when reading it row by row, left to right (that order never changes; dead ones are removed). A goblin `g` starts with 6 hp, an ogre `O` with 15.

**Field of view.** The line from (x0, y0) to (x1, y1) is the list of cells produced by this integer Bresenham routine, start and end included:
```
dx = abs(x1 - x0); dy = -abs(y1 - y0)
sx = 1 if x0 < x1 else -1; sy = 1 if y0 < y1 else -1
err = dx + dy; x, y = x0, y0; cells = []
while True:
    cells.append((x, y))
    if (x, y) == (x1, y1): break
    e2 = 2 * err
    if e2 >= dy: err += dy; x += sx
    if e2 <= dx: err += dx; y += sy
```
A cell is visible from the player if it is on the map, its squared distance `(x-px)**2 + (y-py)**2` from the player is at most 64, and none of the cells of the line from the player to it, other than the two ends, is a wall (so a wall cell is itself visible, but hides what is behind it; monsters and items do not block sight). The player's own cell is visible. `fov()` returns the sorted list of the visible `(x, y)` tuples.

**`act(action)`** plays one turn and returns True if a turn was used. `action` is `"N"` (y - 1), `"S"` (y + 1), `"W"` (x - 1), `"E"` (x + 1), or `None` or `"."` to wait. If `state` is not `"playing"`, nothing happens and it returns False. Player's part:
- A move into a wall or off the map does nothing, uses no turn and returns False.
- A move into a cell with a monster is an attack: take the next die `r`; the monster loses `r + 1` hp; at 0 or less it is removed and `kills` goes up. The player does not move.
- A move into an empty cell moves the player there. A potion on that cell is used up and heals 8 hp (never above 20); stairs set `state` to `"won"`.
- Waiting does nothing.

Then `turn` goes up by 1. If the state is now `"won"`, the turn ends (the monsters do not act) and it returns True. Otherwise the monsters act, one at a time in monster order, and the field of view is the one after the player's move. A monster acts only if its cell is visible. If it is orthogonally adjacent to the player (Manhattan distance 1) it attacks: take the next die `r`. A goblin hits when `r >= 3` and then deals `r - 2` damage; an ogre hits when `r >= 2` and deals `r + 1` damage; otherwise it misses. If the player's `hp` is now 0 or less the state becomes `"dead"` and the remaining monsters do not act. If the monster is not adjacent it takes one step: among the directions N, E, S, W (in that order) it considers each neighbouring cell that is on the map, not a wall, not the player's cell and not occupied by another monster (monsters that have already moved this turn are at their new cells), and measures its Manhattan distance to the player; it moves to the one with the smallest distance, the first in that order if there is a tie, but only if that distance is smaller than its current one; otherwise it stays. Monsters never pick up items and use no dice for moving.'''
tests = '''
def mons(d):
    return [tuple(m) for m in d.monsters()]

# --- start state
d = Dungeon(["#######", "#@.g.O#", "#!..>.#", "#######"], [1])
assert tuple(d.pos) == (1, 1), f"pos is (x, y) = (column, row): {d.pos}"
assert d.hp == 20 and d.state == "playing" and d.kills == 0 and d.turn == 0 and d.rolls_used == 0
assert mons(d) == [("g", 3, 1, 6), ("O", 5, 1, 15)], f"monsters are listed in reading order as (kind, x, y, hp): {mons(d)}"

# --- field of view: Bresenham lines, radius 8, walls block but are seen
d = Dungeon(["#########", "#.......#", "#@..#...#", "#.......#", "#########"], [1])
assert [tuple(c) for c in d.fov()] == [(0, 1), (0, 2), (0, 3), (1, 0), (1, 1), (1, 2), (1, 3), (1, 4), (2, 0), (2, 1), (2, 2), (2, 3), (2, 4), (3, 0), (3, 1), (3, 2), (3, 3), (3, 4), (4, 0), (4, 1), (4, 2), (4, 3), (4, 4), (5, 1), (5, 3), (6, 1), (6, 3), (7, 1), (7, 3)], \
    f"fov() should be the sorted list of (x, y) of every visible cell, own cell and walls hit included: {sorted(map(tuple, d.fov()))}"
vis = {tuple(c) for c in d.fov()}
assert (4, 2) in vis and (5, 2) not in vis and (7, 2) not in vis, "a pillar is seen but hides what is straight behind it"
assert (7, 1) in vis and (5, 0) not in vis, "the line to (5,0) runs through the wall cell (4,0)"

# the exact line matters: from (0,0) to (2,1) the line goes through (1,1), not (1,0)
b = Dungeon(["@..", ".#.", "..."], [1])
assert (2, 1) not in {tuple(c) for c in b.fov()}, "wall at (1,1) is on the line (0,0)-(2,1) and hides (2,1)"
assert (1, 2) not in {tuple(c) for c in b.fov()}, "and also hides (1,2) by the same rule"
c = Dungeon(["@#.", "...", "..."], [1])
assert (2, 1) in {tuple(x) for x in c.fov()}, "a wall at (1,0) is not on the line to (2,1)"

# radius: squared distance at most 64
wide = ["#" * 27, "#" + "." * 25 + "#", "#" + "." * 25 + "#", "#........@" + "." * 15 + "#", "#" + "." * 25 + "#", "#" + "." * 25 + "#", "#" * 27]
d = Dungeon(wide, [1])
vis = {tuple(c) for c in d.fov()}
assert (1, 3) in vis and (17, 3) in vis and (0, 3) not in vis and (18, 3) not in vis, "radius 8 on the row"
assert (2, 1) in vis and (16, 1) in vis and (1, 1) not in vis and (17, 1) not in vis, "squared distance 64 is the limit (dx = 7, dy = 2 is in; dx = 8, dy = 2 is out)"
assert len(vis) == 99, f"number of visible cells {len(vis)}"

# --- walking: walls take no turn
d = Dungeon(["####", "#@.#", "####"], [1])
assert d.act("N") is False and d.turn == 0 and tuple(d.pos) == (1, 1), "bumping a wall does not use a turn"
assert d.act("W") is False and d.turn == 0
assert d.act("E") is True and tuple(d.pos) == (2, 1) and d.turn == 1
assert d.act(None) is True and d.turn == 2 and tuple(d.pos) == (2, 1), "None waits"
assert d.act(".") is True and d.turn == 3, '"." waits too'
d = Dungeon(["@.", ".."], [1])
assert d.act("N") is False and d.act("W") is False, "outside the map is a wall"

# --- combat: player damage is roll + 1, a goblin hits on 3+ for roll - 2
d = Dungeon(["#######", "#@g...#", "#######"], [4, 3, 2])
assert d.act("E") is True
assert mons(d) == [("g", 2, 1, 1)] and d.hp == 19 and d.rolls_used == 2 and tuple(d.pos) == (1, 1), \
    f"first exchange: the player rolls 4 (5 damage, goblin 6 -> 1), the goblin rolls 3 (hits for 1): {mons(d)} hp {d.hp} rolls used {d.rolls_used}"
assert d.act("E") is True
assert mons(d) == [] and d.kills == 1 and d.hp == 19 and d.rolls_used == 3, \
    f"second attack rolls 2 (3 damage) and kills it; a dead goblin does not strike back: {mons(d)} kills {d.kills} hp {d.hp} rolls {d.rolls_used}"
assert d.act("E") is True and tuple(d.pos) == (2, 1)

# misses still use a roll; rolls wrap around
d = Dungeon(["#####", "#@g.#", "#####"], [1, 2])
for i in range(1, 5):
    d.act(None)
    assert d.hp == 20 and d.rolls_used == i, f"goblin misses on 1 and 2 and uses a roll each time: hp {d.hp}, rolls used {d.rolls_used}"

# an ogre hits on 2+ for roll + 1; the player dies at hp 0 or less, and then nothing happens any more
d = Dungeon(["#####", "#@O.#", "#####"], [6])
res = []
for _ in range(3):
    res.append((d.act(None), d.hp, d.state))
assert res == [(True, 13, "playing"), (True, 6, "playing"), (True, -1, "dead")], f"ogre hits for 7: {res}"
assert d.act("E") is False and d.turn == 3 and d.rolls_used == 3 and d.hp == -1, "after death act() does nothing"
d = Dungeon(["#####", "#O@O#", "#####"], [6])
d.act(None); d.act(None)
assert d.state == "dead" and d.rolls_used == 3, f"once the player is dead the other monsters do not act: rolls used {d.rolls_used}"

# --- monsters chase only what they can see, one step towards the player, N then E then S then W on ties
d = Dungeon(["#######", "#.....#", "#...g.#", "#.....#", "#.@...#", "#######"], [1])
d.act(None)
assert mons(d) == [("g", 4, 3, 6)], f"a goblin two columns right and two rows up: the south and west steps tie, south wins: {mons(d)}"
d = Dungeon(["#########", "#@.#...g#", "#..#....#", "#########"], [1])
d.act(None)
assert mons(d) == [("g", 7, 1, 6)], "a monster that cannot see the player stays where it is"

# monsters move one at a time, in order, so the second can follow into the first one's old cell
d = Dungeon(["##########", "#@..gg...#", "##########"], [1])
d.act(None)
assert mons(d) == [("g", 3, 1, 6), ("g", 4, 1, 6)], f"both advance in the same turn: {mons(d)}"
d.act(None)
assert mons(d) == [("g", 2, 1, 6), ("g", 3, 1, 6)]
assert d.rolls_used == 0 and d.hp == 20, "a monster that moves next to the player does not attack in the same turn"
d.act(None)
assert mons(d) == [("g", 2, 1, 6), ("g", 3, 1, 6)] and d.rolls_used == 1, "the one behind is blocked and cannot attack (not adjacent)"

# monsters do not step diagonally, onto walls or onto the player; and they do not attack diagonally
d = Dungeon(["#####", "#@#.#", "#.g.#", "#####"], [6])
d.act(None)
assert mons(d) == [("g", 1, 2, 6)] and d.rolls_used == 0, f"a diagonal neighbour does not attack: it steps to the west cell (the north one is a wall): {mons(d)}"
d.act(None)
assert d.rolls_used == 1, "and once orthogonally adjacent it attacks"

# --- items
d = Dungeon(["######", "#@!.>#", "######"], [1])
d.hp = 15
d.act("E")
assert d.hp == 20 and tuple(d.pos) == (2, 1), f"a potion heals 8 up to 20: hp {d.hp}"
d.act("W"); d.act("E")
assert d.hp == 20
d = Dungeon(["######", "#@!.>#", "######"], [1])
d.hp = 5
d.act("E"); d.act("W"); d.act("E")
assert d.hp == 13, f"a potion is used up when taken: hp {d.hp}"
d.act("E")
assert d.state == "playing"
d.act("E")
assert d.state == "won" and tuple(d.pos) == (4, 1) and d.turn == 5
assert d.act("W") is False and tuple(d.pos) == (4, 1)

# stairs end the game before the monsters act
d = Dungeon(["######", "#@>g.#", "######"], [6])
d.act("E")
assert d.state == "won" and d.hp == 20 and d.rolls_used == 0, "reaching the stairs wins at once; monsters do not get a turn"

# --- a long scripted game: checkpoints every 20 inputs
ROWS = ['##########################', '##.......g.#..#....!#g#..#', '#.#...#..g...............#', '#............##...#......#', '##.#.....#...@#..##.....##', '#...#.......##.g....#...##', '#....................#...#', '#...#..#.................#', '#.........#...O.........##', '#..O.!>...........#.....##', '#........g...............#', '##########################']
