name = "Math word problems"
short = "Math"
description = "Multi-step arithmetic, algebra and counting. Graded on the final number."
check = "number"

[[questions]]
id = "notebooks"
prompt = "A shop sells notebooks for $3.40 each, or in packs of 5 for $15. Maria needs exactly 23 notebooks, but she may buy more if that's cheaper. What is the least she can pay, in dollars?"
answer = "70.20"

[[questions]]
id = "train"
prompt = "A train travels 315 km at 90 km/h, stops for 25 minutes, then travels 120 km at 80 km/h. How many minutes does the whole journey take?"
answer = "325"

[[questions]]
id = "odd-integers"
prompt = "The sum of three consecutive odd integers is 159. What is the largest of them?"
answer = "55"

[[questions]]
id = "pipes"
prompt = "Pipe A fills a tank in 6 hours and pipe B fills it in 4 hours. Drain C empties a full tank in 12 hours. If the tank starts empty and all three are open, how many hours does it take to fill?"
answer = "3"

[[questions]]
id = "up-down"
prompt = "A price is raised by 20% and the new price is then lowered by 20%. The final price is $96. What was the original price, in dollars?"
answer = "100"

[[questions]]
id = "divisible"
prompt = "How many positive integers less than 1000 are divisible by 3 or by 5, but not by 15?"
answer = "400"

[[questions]]
id = "committee"
prompt = "A committee of 3 is chosen from 7 people. Two of the people refuse to serve together. How many different committees are possible?"
answer = "30"

[[questions]]
id = "rectangle"
prompt = "A rectangle has a perimeter of 46 cm and a diagonal of 17 cm. What is its area in square centimetres?"
answer = "120"

[[questions]]
id = "dice"
prompt = "Two fair six-sided dice are rolled. What is the probability that their sum is 8? Give it as a fraction or a decimal."
answer = "5/36"
tolerance = 0.0005

[[questions]]
id = "power-mod"
prompt = "What is the remainder when 7^100 is divided by 13?"
answer = "9"

[[questions]]
id = "snail"
prompt = "A snail is at the bottom of a 20 m well. Each day it climbs 5 m, and each night it slides back 3 m. On which day does it first reach the top?"
answer = "9"

[[questions]]
id = "average"
prompt = "The average of five numbers is 18. After one number is removed, the average of the remaining four is 16. What number was removed?"
answer = "26"

[[questions]]
id = "change"
prompt = "Apples cost $2 for 3 and oranges cost $3 for 4. Tom buys 18 apples and 20 oranges and pays with a $50 note. How much change does he get, in dollars?"
answer = "23"

[[questions]]
id = "workers"
prompt = "6 workers can build a wall in 10 days. After 4 days of work, 2 more workers join, all working at the same rate. How many days does the whole job take, from the start?"
answer = "8.5"

[[questions]]
id = "remainders"
prompt = "What is the largest three-digit number that leaves a remainder of 2 when divided by 7 and a remainder of 3 when divided by 5?"
answer = "968"

[[questions]]
id = "polygon-angles"
prompt = "What is the sum of the interior angles of a 14-sided polygon, in degrees?"
answer = "2160"

[[questions]]
id = "depreciation"
prompt = "A car loses 15% of its value every year. After 3 years it is worth $12,282.50. What was it worth when new, in dollars?"
answer = "20000"

[[questions]]
id = "trailing-zeros"
prompt = "How many zeros are at the end of 125! (125 factorial)?"
answer = "31"

[[questions]]
id = "clock"
prompt = "What is the smaller angle between the hour hand and the minute hand of a clock at 3:40, in degrees?"
answer = "130"

[[questions]]
id = "compose"
prompt = "If f(x) = 2x² − 3x + 1, what is f(f(2))?"
answer = "10"

[[questions]]
id = "dilute"
prompt = "You have 40 litres of a 25% acid solution. How many litres of pure water must you add to make it a 10% solution?"
answer = "60"

[[questions]]
id = "diagonals"
prompt = "How many diagonals does a convex 12-sided polygon have?"
answer = "54"
