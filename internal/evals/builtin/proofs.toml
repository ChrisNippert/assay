name = "Proofs"
short = "Proofs"
description = "Classic proofs, from number theory to combinatorics, plus one false claim to catch. Graded by a judge model against a reference proof."
check = "judge"

[[questions]]
id = "sqrt2"
prompt = "Prove that √2 is irrational."
answer = '''Suppose √2 = p/q with p, q positive integers and the fraction in lowest terms. Then p² = 2q², so p² is even, so p is even (the square of an odd number is odd). Write p = 2k; then 4k² = 2q², so q² = 2k² is even and q is even. Both p and q are even, contradicting lowest terms. Hence √2 is irrational.'''

[[questions]]
id = "primes-infinite"
prompt = "Prove that there are infinitely many prime numbers."
answer = '''Suppose there are finitely many primes p₁, …, pₙ. Let N = p₁p₂⋯pₙ + 1. N > 1, so N has a prime factor p (every integer greater than 1 does). p is one of the pᵢ, so p divides p₁⋯pₙ, and p divides N, so p divides N − p₁⋯pₙ = 1, which is impossible. So there are infinitely many primes.'''

[[questions]]
id = "odd-sum"
prompt = "Prove that for every positive integer n, the sum of the first n odd numbers, 1 + 3 + 5 + … + (2n − 1), equals n²."
answer = '''Induction on n. For n = 1 the sum is 1 = 1². Suppose 1 + 3 + … + (2n − 1) = n². Adding the next odd number, 2(n + 1) − 1 = 2n + 1, gives n² + 2n + 1 = (n + 1)², which is the claim for n + 1. By induction it holds for all n ≥ 1.'''

[[questions]]
id = "cube-minus"
prompt = "Prove that n³ − n is divisible by 6 for every integer n."
answer = '''n³ − n = (n − 1)n(n + 1), the product of three consecutive integers. Among any two consecutive integers one is even, so the product is divisible by 2. Among any three consecutive integers one is divisible by 3, so the product is divisible by 3. Since 2 and 3 are coprime, the product is divisible by 6. (This holds for negative n and n = 0 too, since the argument only uses consecutiveness.)'''

[[questions]]
id = "two-power"
prompt = "Prove that 2ⁿ > n² for every integer n ≥ 5."
answer = '''Induction on n. For n = 5: 32 > 25. Suppose 2ⁿ > n² for some n ≥ 5. Then 2ⁿ⁺¹ = 2·2ⁿ > 2n². It remains to show 2n² ≥ (n + 1)², i.e. n² ≥ 2n + 1, i.e. n² − 2n − 1 ≥ 0, i.e. (n − 1)² ≥ 2, which holds for n ≥ 3. So 2ⁿ⁺¹ > (n + 1)², and by induction the claim holds for all n ≥ 5.'''

[[questions]]
id = "handshake"
prompt = "Prove that in every finite graph, the number of vertices of odd degree is even."
answer = '''Each edge has two ends, so the sum of all vertex degrees equals twice the number of edges, which is even. Split the sum into the degrees of even-degree vertices (an even total) and of odd-degree vertices. The odd-degree part is then even minus even, so even. A sum of odd numbers is even only when there is an even number of them, so the number of odd-degree vertices is even.'''

[[questions]]
id = "pigeonhole-square"
prompt = "Five points are placed anywhere in a square of side length 1 (inside or on the boundary). Prove that some two of them are at distance at most √2/2 from each other."
answer = '''Divide the unit square into four closed squares of side 1/2 by joining the midpoints of opposite sides. Every point of the square lies in at least one of them. With five points and four small squares, by the pigeonhole principle two points lie in the same small square. Two points in a square of side 1/2 are at most its diagonal apart, which is √2/2.'''

[[questions]]
id = "four-consecutive"
prompt = "Prove that the product of four consecutive integers, plus one, is always a perfect square."
answer = '''Let the integers be n, n + 1, n + 2, n + 3. Then n(n + 3) = n² + 3n and (n + 1)(n + 2) = n² + 3n + 2. With m = n² + 3n, the product plus one is m(m + 2) + 1 = m² + 2m + 1 = (m + 1)² = (n² + 3n + 1)², a perfect square since n² + 3n + 1 is an integer.'''

[[questions]]
id = "sqrt2-plus-sqrt3"
prompt = "Prove that √2 + √3 is irrational."
answer = '''Suppose r = √2 + √3 is rational. Then r² = 5 + 2√6 is rational, so √6 = (r² − 5)/2 is rational. But √6 is irrational: if √6 = p/q in lowest terms then p² = 6q², so p² is even, so p is even; writing p = 2k gives 2k² = 3q², so 3q² is even, so q is even (3 is odd), contradicting lowest terms. Hence √2 + √3 is irrational. (Any correct proof that √6 is irrational, or another valid route, is fine; simply asserting √6 is irrational without justification is a gap.)'''

[[questions]]
id = "prime-factor"
prompt = "Prove that every integer n > 1 can be written as a product of one or more primes."
answer = '''Strong induction on n. For n = 2, n is prime. Suppose every integer m with 1 < m < n is a product of primes. If n is prime, it is a product of one prime. Otherwise n = ab with 1 < a, b < n; by the hypothesis both a and b are products of primes, so n = ab is too. Hence every n > 1 is a product of primes.'''

[[questions]]
id = "pythagorean-three"
prompt = "Prove that if a, b, c are integers with a² + b² = c², then at least one of a and b is divisible by 3."
answer = '''Every integer is congruent to 0, 1 or 2 mod 3, and its square is then congruent to 0, 1 or 1 mod 3. So squares are 0 or 1 mod 3, and a square is 0 mod 3 exactly when the number is divisible by 3. If neither a nor b were divisible by 3, then a² + b² ≡ 1 + 1 = 2 (mod 3). But c² is 0 or 1 mod 3, never 2. Contradiction, so 3 divides a or b.'''

[[questions]]
id = "harmonic"
prompt = "Prove that the harmonic series 1 + 1/2 + 1/3 + 1/4 + … diverges."
answer = '''Group the terms: 1 + 1/2 + (1/3 + 1/4) + (1/5 + … + 1/8) + (1/9 + … + 1/16) + …. The group from 1/(2ᵏ + 1) to 1/2ᵏ⁺¹ has 2ᵏ terms, each at least 1/2ᵏ⁺¹, so it sums to at least 1/2. Hence the partial sum up to 1/2ᵐ is at least 1 + m/2, which grows without bound. The partial sums are increasing and unbounded, so the series diverges.'''

[[questions]]
id = "euler-polynomial"
prompt = "Prove that n² + n + 41 is prime for every positive integer n."
answer = '''The statement is false, so it can't be proved. For n = 40: 40² + 40 + 41 = 1600 + 40 + 41 = 1681 = 41², which is not prime. (Also n = 41 gives 41·43.) An answer passes only if it shows the claim is false with a valid counterexample; any "proof" of the claim fails.'''

[[questions]]
id = "power-set"
prompt = "Prove that the set of all subsets of the natural numbers is uncountable."
answer = '''Suppose f: ℕ → P(ℕ) is a surjection, i.e. the subsets can be listed as f(0), f(1), …. Let D = { n ∈ ℕ : n ∉ f(n) }. D is a subset of ℕ, so D = f(m) for some m. If m ∈ D then by definition m ∉ f(m) = D; if m ∉ D = f(m) then by definition m ∈ D. Either way a contradiction, so no surjection exists and P(ℕ) is uncountable. (Equivalent diagonal arguments with 0/1 sequences are fine.)'''
