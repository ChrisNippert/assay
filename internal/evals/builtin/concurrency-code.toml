        r = _rnd.Random(k)
        for i in range(1200):
            s = names[(i + k) % 6]
            d = names[(i + k + 1) % 6] if i % 3 else names[(i + k - 1) % 6]
            try:
                b.transfer(s, d, r.randint(1, 20))
            except InsufficientFunds:
                pass
    _run_threads([lambda k=k: ring(k) for k in range(12)], what="ring transfer threads")
    assert b.total() == 3000, "money was created or destroyed: total is %d" % b.total()
    assert all(b.balance(n) >= 0 for n in names)

    # ---- heavy random traffic with a watcher: totals are always consistent, balances never negative ----
    names = ["acct%d" % i for i in range(5)]
    start = {n: 300 for n in names}
    b = Bank(start)
    stop = []
    problems = []
    okcount = [0]
    failcount = [0]

    def watcher():
        n = 0
        while not stop:
            t = b.total()
            if t != 1500:
                problems.append("total() returned %d while the bank holds 1500" % t)
                return
            for nm in names:
                v = b.balance(nm)
                if v < 0:
                    problems.append("balance of %s was %d" % (nm, v))
                    return
            n += 1
        okcount.append(n)

    def trader(k):
        r = _rnd.Random(1000 + k)
        for _ in range(3000):
            s, d = r.sample(names, 2)
            try:
                b.transfer(s, d, r.randint(1, 120))
                okcount[0] += 1
            except InsufficientFunds:
                failcount[0] += 1
    ws = [_th.Thread(target=watcher, daemon=True) for _ in range(3)]
    for w in ws:
        w.start()
    try:
        _run_threads([lambda k=k: trader(k) for k in range(16)], what="trader threads")
    finally:
        stop.append(1)
    for w in ws:
        w.join(5)
        assert not w.is_alive(), "total()/balance() never returned (deadlock)"
    assert not problems, problems[0]
    assert b.total() == 1500, "money was created or destroyed: total is %d" % b.total()
    vals = [b.balance(n) for n in names]
    assert min(vals) >= 0, "negative balance: %r" % (vals,)
    assert sum(vals) == 1500
    assert failcount[0] > 0 and okcount[0] > 0

    # ---- overdraft race: ten threads try to spend the same 100 coins ----
    for rep in range(8):
        b = Bank({"src": 100, "dst": 0, "other": 0})
        wins = []
        gate = _th.Barrier(10, timeout=5)

        def spend():
            gate.wait()
            for _ in range(30):
                try:
                    b.transfer("src", "dst", 1)
                    wins.append(1)
                except InsufficientFunds:
                    pass
        _run_threads([spend] * 10, what="spenders")
        assert b.balance("src") == 0 and b.balance("dst") == 100, "after spending 100 coins: src=%d dst=%d" % (b.balance("src"), b.balance("dst"))
        assert len(wins) == 100, "%d transfers succeeded from an account holding exactly 100 (one per coin)" % len(wins)

    # ---- failed transfers leave nothing locked ----
    b = Bank({"p": 1, "q": 1})

    def failer():
        for _ in range(500):
            _raises(InsufficientFunds, lambda: b.transfer("p", "q", 5))
            _raises(ValueError, lambda: b.transfer("p", "q", 0))
            _raises(KeyError, lambda: b.transfer("p", "nope", 1))
    _run_threads([failer] * 4, what="failing threads")
    g = _Bg(lambda: (b.transfer("p", "q", 1), b.transfer("q", "p", 2), b.total())[-1])
    g.finish(5, "transfer after failed transfers")
    assert g.res == 2 and g.exc is None, g.exc


_hammer(_suite)
'''

