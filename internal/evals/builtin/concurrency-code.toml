Write a thread-safe LRU cache whose `get_or_compute` computes each missing key only once, even when many threads miss on it at the same moment. Define everything exactly as below; hidden tests hammer it from many threads with forced frequent thread switches and check the eviction order, that each key is computed exactly once, that different keys are computed in parallel, and that nothing deadlocks. Only the standard library is available. Reply with one Python code block.

**`LRUCache(capacity)`**: `capacity` is an int >= 1 (otherwise `ValueError`). The cache holds at most `capacity` entries; values can be any objects, including `None`.

**`get(key, default=None)`** returns the cached value, or `default` if the key is absent. A hit makes the key the most recently used.

**`put(key, value)`** stores the value (replacing an existing one) and makes the key the most recently used. If the cache now holds more than `capacity` entries, the least recently used entry is removed.

**`len(cache)`** is the number of entries; **`keys()`** returns a list of the keys from the least recently used to the most recently used.

**`get_or_compute(key, fn)`**: if the key is cached, return its value (and it becomes the most recently used). Otherwise call `fn(key)`, store the result as by `put`, and return it. The rules for the miss case:
- **Once.** If several threads call `get_or_compute` for the same missing key at the same time, `fn` runs in only one of them; the others wait for that computation and all return the same value. (If the entry is evicted later and requested again, it is computed again; that is fine.)
- **In parallel.** Computations for different keys must be able to run at the same time: a slow `fn` for one key must not block `fn` for another key, nor `get` / `put` / `get_or_compute` hits on other keys, and the cache must not be locked while `fn` runs. In particular `fn` itself may call methods of the same cache (for example `get_or_compute` of another key) without deadlocking.
- **Failures.** If `fn` raises, that exception object is raised in the thread that ran `fn` and in every thread that was waiting for that computation; nothing is stored, and the next call for the key calls `fn` again. Waiting threads must never be left hanging.

