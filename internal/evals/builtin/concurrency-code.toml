id = "cyclic-barrier"
prompt = '''
Write a reusable (cyclic) barrier for Python threads. Define everything exactly as below; hidden tests run many threads through hundreds of rounds with forced frequent thread switches and check that nobody ever gets through early, that every round is complete before anyone leaves it, that the action runs once per round at the right moment, and that nothing deadlocks. Only the standard library is available. Do not use `threading.Barrier`: build the barrier yourself from locks, conditions or semaphores. Reply with one Python code block.

**`CyclicBarrier(parties, action=None)`**: `parties` is an int >= 1 (otherwise `ValueError`); `action` is `None` or a function with no arguments.

**`wait()`** blocks the calling thread until `parties` threads (counting this one) are waiting at the barrier. Then all of them are released together and the barrier is immediately ready for the next round, with no reset call, so the same threads can come back at once and wait again. A thread that is released and races straight into the next `wait()` must count for the *next* round only, and must never be mixed up with threads that have not yet left the previous round.

`wait()` returns an int to each thread: the order in which that thread arrived in its round, from `0` for the first arrival to `parties - 1` for the last. Every round hands out each of the numbers `0 … parties-1` exactly once.

**The action.** If `action` is given, it is called exactly once per round, with no arguments, by the *last* thread to arrive (the one whose `wait()` returns `parties - 1`), after all parties have arrived and *before* any of them is released. So everything the action does is visible to all threads when their `wait()` returns, and the action never runs while a party of that round is still on its way. If the action raises, the barrier does not need to handle it (the tests never do this).

**Other.** With `parties == 1`, `wait()` runs the action (if any) and returns `0` at once. A `CyclicBarrier` also has a read-only property `parties`. There are no timeouts.
'''
