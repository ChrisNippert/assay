                assert counter[0] > r, "wait() returned in round %d before the action ran" % r
        _run_threads([lambda t=t: worker(t) for t in range(P)], timeout=9, what="barrier threads")
        assert counter[0] == R, "action ran %d times for %d rounds" % (counter[0], R)
        assert [r for r, _ in acts_seen] == list(range(R))
        for r, ident in acts_seen:
            assert last_thread[r] == ident, "the action of round %d was not run by the last thread to arrive" % r
        for r in range(R):
            got = sorted(idx[t][r] for t in range(P))
            assert got == list(range(P)), "round %d handed out arrival numbers %r" % (r, got)

    run(8, 250, None)
    run(3, 1200, None)
    run(2, 1500, None)
    run(5, 200, (2, 7))
    run(16, 60, (0, 3))

