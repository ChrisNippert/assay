prompt = '''
Write a thread-safe in-memory bank for Python threads. Define everything exactly as below; hidden tests run thousands of transfers between the same few accounts from many threads, in both directions at once, with forced frequent thread switches, and check that the money is conserved, no balance goes negative, a total taken in the middle of the traffic is consistent, and nothing deadlocks. Only the standard library is available. Reply with one Python code block.

**Names.** An exception class `InsufficientFunds(Exception)` and a class `Bank`.

**`Bank(balances)`**: `balances` is a dict mapping account names (strings) to starting balances (ints >= 0). The bank keeps its own copy.

**`balance(name)`** returns the account's current balance. **`total()`** returns the sum of all balances. `balance` raises `KeyError` for an unknown name. `total()` must be consistent: whatever transfers are going on, it always equals the sum the bank was created with (it never sees money that has left one account and not yet arrived in the other).

**`transfer(src, dst, amount)`** moves `amount` from account `src` to account `dst` as one atomic step and returns `None`. Checks, in this order:
1. `amount` must be an int > 0, otherwise `ValueError`.
2. `src` and `dst` must both exist, otherwise `KeyError` (nothing changes).
3. If `src` holds less than `amount`, raise `InsufficientFunds` (nothing changes).
4. If `src == dst` nothing changes (but the checks above still apply, including the funds check).

**Guarantees.** All amounts are ints. A balance is never negative, not even for a moment, and the sum of all balances never changes. Transfers between different pairs of accounts need not run in parallel with each other, but any mix of concurrent `transfer`, `balance` and `total` calls from any number of threads must complete: the classic trap is two threads moving money in opposite directions between the same two accounts at the same time, which must not deadlock. A transfer that fails for lack of funds must not block other transfers for long and must not leave anything locked.
