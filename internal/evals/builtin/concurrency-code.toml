id = "bounded-queue"
prompt = '''
Write a thread-safe bounded FIFO queue for Python threads. Define everything exactly as below; hidden tests hammer it from many threads with forced frequent thread switches and check blocking, timeouts, closing, ordering and that nothing is lost, duplicated or deadlocked. Only the standard library is available. Reply with one Python code block.

**Names.** An exception class `QueueClosed(Exception)` and a class `BoundedQueue`.

**`BoundedQueue(capacity)`**: `capacity` is an int >= 1 (otherwise raise `ValueError`). Items can be any objects, including `None`. `len(q)` is the number of items currently queued. A queue is open until `close()` is called.

**`put(item, timeout=None)`**: appends the item. If the queue is full, the caller blocks until there is room. `timeout=None` waits as long as needed; a number is the longest wait in seconds, after which `TimeoutError` is raised (the built-in one) and the item is not added; `timeout=0` never blocks (raises `TimeoutError` at once if full). If the queue is closed, or becomes closed while the caller is waiting, `put` raises `QueueClosed` and the item is not added (this check comes first, even when there would be room).

**`get(timeout=None)`**: removes and returns the oldest item. If the queue is empty it blocks, with the same `timeout` meaning and the same `TimeoutError`. If the queue is closed, items that are still queued are returned normally (oldest first); once it is closed and empty, `get` raises `QueueClosed`, including for callers already blocked in `get` when `close()` is called.

**`close()`**: marks the queue closed and wakes every blocked caller so they can react. Calling it again does nothing.

**Guarantees.** Items come out in the order they went in (FIFO). The queue never holds more than `capacity` items, not even for a moment. Every item that a `put` accepted is returned by exactly one `get`. Many threads may call any method at the same time, and a blocked caller must never be left waiting when it could proceed (no lost wake-ups, no deadlocks). Blocked callers must not busy-wait.
'''
tests = '''
import sys as _sys
import threading as _th
import time as _time

_si_saved = _sys.getswitchinterval()


def _run_threads(fns, timeout=10.0, what="threads"):
    """Run each callable in its own daemon thread; fail on deadlock; re-raise the first error."""
    errs = []

    def wrap(f):
        def g():
            try:
                f()
            except BaseException as e:
                errs.append(e)
        return g

    ts = [_th.Thread(target=wrap(f), daemon=True) for f in fns]
    for t in ts:
        t.start()
    end = _time.monotonic() + timeout
    for t in ts:
        t.join(max(0.0, end - _time.monotonic()))
    stuck = sum(t.is_alive() for t in ts)
    assert not stuck, "DEADLOCK or lost wake-up: %d of %d %s still blocked after %.0f s" % (stuck, len(ts), what, timeout)
    if errs:
        raise errs[0]


class _Bg:
    """Runs f() in a daemon thread; .wait(t) joins; .alive, .res, .exc."""

    def __init__(self, f):
        self.res = None
        self.exc = None

        def g():
            try:
                self.res = f()
            except BaseException as e:
                self.exc = e
        self._t = _th.Thread(target=g, daemon=True)
        self._t.start()

    def wait(self, t):
        self._t.join(t)
        return not self._t.is_alive()

    @property
    def alive(self):
        return self._t.is_alive()

    def finish(self, t=5.0, what="call"):
        assert self.wait(t), "%s is still blocked after %.0f s (deadlock, lost wake-up or ignored wake-up)" % (what, t)
        return self


def _raises(exc, f, what="call"):
    try:
        f()
    except exc as e:
        return e
    except BaseException as e:
        raise AssertionError("%s raised %r, expected %s" % (what, e, exc.__name__))
    raise AssertionError("%s did not raise %s" % (what, exc.__name__))


def _hammer(suite):
    _sys.setswitchinterval(1e-6)
    _stack_saved = _th.stack_size()
    try:
        _th.stack_size(512 * 1024)  # many threads must fit in the 1 GB address-space limit
    except (ValueError, RuntimeError):
        pass
    try:
        suite()
    finally:
        _sys.setswitchinterval(_si_saved)
        try:
            _th.stack_size(_stack_saved)
        except (ValueError, RuntimeError):
            pass


class _Noise:
    """Context manager: n busy threads that compete for the interpreter, so thread switches happen at nearly every call."""

    def __init__(self, n=2):
        self.n = n
        self.stop = False

    def _spin(self):
        while not self.stop:
            pass

    def __enter__(self):
        for _ in range(self.n):
            _th.Thread(target=self._spin, daemon=True).start()
        return self

    def __exit__(self, *a):
        self.stop = True


def _suite():
    # ---- single-threaded behaviour ----
    _raises(ValueError, lambda: BoundedQueue(0))
    q = BoundedQueue(2)
    assert len(q) == 0
    q.put(1)
    q.put(None)
    assert len(q) == 2
    _raises(TimeoutError, lambda: q.put(3, timeout=0), "put on a full queue with timeout=0")
    t0 = _time.monotonic()
    _raises(TimeoutError, lambda: q.put(3, timeout=0.15), "put on a full queue with timeout=0.15")
    el = _time.monotonic() - t0
    assert 0.12 <= el < 3, "put timeout took %.3f s for 0.15" % el
    assert len(q) == 2, "a timed-out put must not add the item"
    assert q.get() == 1 and q.get() is None
    _raises(TimeoutError, lambda: q.get(timeout=0), "get on an empty queue with timeout=0")
    t0 = _time.monotonic()
    _raises(TimeoutError, lambda: q.get(timeout=0.15), "get on an empty queue with timeout=0.15")
    el = _time.monotonic() - t0
    assert 0.12 <= el < 3, "get timeout took %.3f s for 0.15" % el

    # ---- blocking: a get really waits for a put; a put waits for room ----
    q = BoundedQueue(1)
    g = _Bg(lambda: q.get())
    assert not g.wait(0.3), "get on an empty queue returned without any put"
    q.put("x")
    g.finish(5, "blocked get after a put")
    assert g.res == "x" and g.exc is None
    q.put("a")
    p = _Bg(lambda: q.put("b"))
    assert not p.wait(0.3), "put on a full queue returned without room"
    assert len(q) == 1
    assert q.get() == "a"
    p.finish(5, "blocked put after a get")
    assert p.exc is None and len(q) == 1 and q.get() == "b"

    # blocked callers sleep: they must not burn CPU while waiting
    q = BoundedQueue(1)
    waiters = [_Bg(lambda: q.get()) for _ in range(6)]
    _time.sleep(0.1)
    c0 = _time.process_time()
    _time.sleep(0.6)
    spent = _time.process_time() - c0
    assert spent < 0.06, "6 blocked get() calls used %.2f s of CPU in 0.6 s: they are busy-waiting" % spent
    for _ in range(6):
        q.put(0)
    for w in waiters:
        w.finish(5, "blocked get")

    # timeouts while other threads are waiting still work, and a wait with a timeout is woken by a put
    q = BoundedQueue(1)
    g = _Bg(lambda: q.get(timeout=5))
    _time.sleep(0.1)
    q.put(7)
    g.finish(3, "get(timeout=5) after a put")
    assert g.res == 7

    # ---- closing ----
    q = BoundedQueue(1)
    getters = [_Bg(lambda: q.get()) for _ in range(4)]
    _time.sleep(0.2)
    q.close()
    for gb in getters:
        gb.finish(5, "get blocked on an empty queue when close() was called")
        assert isinstance(gb.exc, QueueClosed), "blocked get after close: %r" % (gb.exc,)
    q = BoundedQueue(1)
    q.put("full")
    putters = [_Bg(lambda: q.put("late")) for _ in range(4)]
    _time.sleep(0.2)
    q.close()
    for pb in putters:
        pb.finish(5, "put blocked on a full queue when close() was called")
        assert isinstance(pb.exc, QueueClosed), "blocked put after close: %r" % (pb.exc,)
    assert len(q) == 1
    assert q.get() == "full"
    _raises(QueueClosed, lambda: q.get(), "get on a closed empty queue")
    _raises(QueueClosed, lambda: q.get(timeout=0), "get(timeout=0) on a closed empty queue")
    q = BoundedQueue(5)
    for i in range(3):
        q.put(i)
    q.close()
    q.close()
    _raises(QueueClosed, lambda: q.put(9), "put on a closed queue with room")
    assert [q.get(), q.get(), q.get()] == [0, 1, 2]
    _raises(QueueClosed, lambda: q.get())

    # ---- one producer, one consumer: exact FIFO order ----
    q = BoundedQueue(2)
    n = 1500
    got = []

    def prod():
        for i in range(n):
            q.put(i)
        q.close()

    def cons():
        while True:
            try:
                got.append(q.get())
            except QueueClosed:
                return
    _run_threads([prod, cons], what="producer/consumer threads")
    assert got == list(range(n)), "items lost, duplicated or out of order"

    # ---- many producers and consumers ----
    def stress(cap, nprod, ncons, per):
        q = BoundedQueue(cap)
        stop = []
        peak = [0]
        results = [[] for _ in range(ncons)]
        prods_left = [nprod]
        m = _th.Lock()

        def prod(pid):
            for i in range(per):
                q.put((pid, i))
            with m:
                prods_left[0] -= 1
                if prods_left[0] == 0:
                    q.close()

        def cons(k):
            out = results[k]
            while True:
                try:
                    out.append(q.get())
                except QueueClosed:
                    return

        def monitor():
            while not stop:
                n = len(q)
                if n > peak[0]:
                    peak[0] = n
                _time.sleep(0)
        mon = _th.Thread(target=monitor, daemon=True)
        mon.start()
        try:
            _run_threads([lambda p=p: prod(p) for p in range(nprod)] + [lambda k=k: cons(k) for k in range(ncons)],
                         what="producer/consumer threads")
        finally:
            stop.append(1)
        assert peak[0] <= cap, "queue held %d items with capacity %d" % (peak[0], cap)
        allitems = [x for r in results for x in r]
        assert len(allitems) == nprod * per, "got %d items, expected %d (lost or duplicated)" % (len(allitems), nprod * per)
        assert len(set(allitems)) == len(allitems), "an item was delivered twice"
        for r in results:
            last = {}
            for pid, i in r:
                assert last.get(pid, -1) < i, "FIFO order broken for producer %d" % pid
                last[pid] = i
        assert len(q) == 0

    stress(3, 6, 6, 400)
    stress(1, 4, 4, 300)
    stress(8, 3, 9, 300)
    stress(2, 9, 2, 200)
    stress(1, 16, 2, 120)
    stress(4, 2, 16, 150)

    # ---- timeouts under load: items put with timeouts are never lost ----
    q = BoundedQueue(2)
    accepted = []
    received = []
    done = []
    lock = _th.Lock()

    def tprod(pid):
        for i in range(150):
            try:
                q.put((pid, i), timeout=0.002)
                with lock:
                    accepted.append((pid, i))
            except TimeoutError:
                pass

    def tcons():
        while True:
            try:
                x = q.get(timeout=0.002)
                with lock:
                    received.append(x)
            except TimeoutError:
                if done:
                    return
    cs = [_Bg(tcons) for _ in range(3)]
    _run_threads([lambda p=p: tprod(p) for p in range(5)], what="producers")
    done.append(1)
    for c in cs:
        c.finish(10, "consumer")
        assert c.exc is None, c.exc
    while len(q):
        received.append(q.get())
    assert sorted(accepted) == sorted(received), "accepted %d items, received %d" % (len(accepted), len(received))


_hammer(_suite)
'''

[[questions]]
id = "rw-lock"
prompt = '''
Write a writer-preferring reader-writer lock for Python threads. Define everything exactly as below; hidden tests hammer it from many threads with forced frequent thread switches and check mutual exclusion, that readers really share the lock, writer preference, and that nothing deadlocks. Only the standard library is available. Reply with one Python code block.

**`RWLock()`** has two methods, `read_lock()` and `write_lock()`. Each returns a context manager, used as `with lock.read_lock():` or `with lock.write_lock():`. Entering blocks until the lock is granted; leaving releases it, also when the body raised an exception (the exception then propagates as usual). A fresh context manager is returned by every call, and one `RWLock` is shared by many threads.

**Rules.**
- Any number of threads may hold the read lock at the same time.
- The write lock is exclusive: while a thread holds it, no other thread holds the read lock or the write lock.
- **Writers are preferred.** As soon as a writer is waiting for the lock, readers that arrive afterwards must wait, even though other readers are holding the lock right now. The waiting writer gets the lock as soon as the readers that already hold it have left. Readers get in again once no writer is waiting or writing.
- No lock is re-entrant: a thread must not ask for the lock again while it holds it (the tests never do this).
- Waiting threads must sleep, not spin, and every thread that can proceed must be woken (no lost wake-ups, no deadlocks).
'''
tests = '''
import sys as _sys
import threading as _th
import time as _time

_si_saved = _sys.getswitchinterval()


def _run_threads(fns, timeout=10.0, what="threads"):
    """Run each callable in its own daemon thread; fail on deadlock; re-raise the first error."""
    errs = []

    def wrap(f):
        def g():
            try:
                f()
            except BaseException as e:
                errs.append(e)
        return g

    ts = [_th.Thread(target=wrap(f), daemon=True) for f in fns]
    for t in ts:
        t.start()
    end = _time.monotonic() + timeout
    for t in ts:
        t.join(max(0.0, end - _time.monotonic()))
    stuck = sum(t.is_alive() for t in ts)
    assert not stuck, "DEADLOCK or lost wake-up: %d of %d %s still blocked after %.0f s" % (stuck, len(ts), what, timeout)
    if errs:
        raise errs[0]


class _Bg:
    """Runs f() in a daemon thread; .wait(t) joins; .alive, .res, .exc."""

    def __init__(self, f):
        self.res = None
        self.exc = None

        def g():
            try:
                self.res = f()
            except BaseException as e:
                self.exc = e
        self._t = _th.Thread(target=g, daemon=True)
        self._t.start()

    def wait(self, t):
        self._t.join(t)
        return not self._t.is_alive()

    @property
    def alive(self):
        return self._t.is_alive()

    def finish(self, t=5.0, what="call"):
        assert self.wait(t), "%s is still blocked after %.0f s (deadlock, lost wake-up or ignored wake-up)" % (what, t)
        return self


def _raises(exc, f, what="call"):
    try:
        f()
    except exc as e:
        return e
    except BaseException as e:
        raise AssertionError("%s raised %r, expected %s" % (what, e, exc.__name__))
    raise AssertionError("%s did not raise %s" % (what, exc.__name__))


def _hammer(suite):
    _sys.setswitchinterval(1e-6)
    _stack_saved = _th.stack_size()
    try:
        _th.stack_size(512 * 1024)  # many threads must fit in the 1 GB address-space limit
    except (ValueError, RuntimeError):
        pass
    try:
        suite()
    finally:
        _sys.setswitchinterval(_si_saved)
        try:
            _th.stack_size(_stack_saved)
        except (ValueError, RuntimeError):
            pass


class _Noise:
    """Context manager: n busy threads that compete for the interpreter, so thread switches happen at nearly every call."""

    def __init__(self, n=2):
        self.n = n
        self.stop = False

    def _spin(self):
        while not self.stop:
            pass

    def __enter__(self):
        for _ in range(self.n):
            _th.Thread(target=self._spin, daemon=True).start()
        return self

    def __exit__(self, *a):
        self.stop = True


def _suite():
    # ---- readers really share the lock ----
    lk = RWLock()
    bar = _th.Barrier(5, timeout=5)

    def reader_meet():
        with lk.read_lock():
            bar.wait()
    try:
        _run_threads([reader_meet] * 5, what="readers")
    except _th.BrokenBarrierError:
        raise AssertionError("5 readers could not hold the read lock at the same time")

    # ---- a writer waits for the readers that hold the lock, then is exclusive ----
    lk = RWLock()
    ev = []
    rel = _th.Event()

    def r1():
        with lk.read_lock():
            ev.append("r1 in")
            rel.wait(10)
            ev.append("r1 out")

    def w1():
        ev.append("w try")
        with lk.write_lock():
            ev.append("w in")
            _time.sleep(0.05)
            ev.append("w out")
    a = _Bg(r1)
    for _ in range(200):
        if "r1 in" in ev:
            break
        _time.sleep(0.01)
    assert "r1 in" in ev
    w = _Bg(w1)
    _time.sleep(0.3)
    assert "w in" not in ev, "writer entered while a reader held the lock"
    # ---- writer preference: a reader arriving now must queue behind the waiting writer ----
    def r2fn():
        with lk.read_lock():
            ev.append("r2 in")
    r2 = _Bg(r2fn)
    _time.sleep(0.3)
    assert "r2 in" not in ev, "a new reader got in although a writer was waiting (not writer-preferring)"
    assert "w in" not in ev
    rel.set()
    a.finish(5, "first reader")
    w.finish(5, "writer")
    r2.finish(5, "late reader")
    assert ev.index("w out") < ev.index("r2 in"), "the waiting writer must run before the late reader: %r" % (ev,)
    assert ev.index("r1 out") < ev.index("w in")

    # a new lock is free again afterwards
    lk = RWLock()
    with lk.write_lock():
        pass
    with lk.read_lock():
        pass

    # ---- readers held back by a waiting writer all get in together once it is done ----
    lk = RWLock()
    rel = _th.Event()
    inside = _th.Event()

    def holder():
        with lk.write_lock():
            inside.set()
            rel.wait(10)
    h = _Bg(holder)
    assert inside.wait(5)
    bar = _th.Barrier(4, timeout=5)

    def meet():
        with lk.read_lock():
            bar.wait()
    rs = [_Bg(meet) for _ in range(4)]
    _time.sleep(0.3)
    assert not bar.n_waiting, "readers entered while a writer held the lock"
    rel.set()
    h.finish(5, "writer")
    for r in rs:
        r.finish(8, "reader released by the writer")
        assert r.exc is None, "readers released by a finished writer must be able to share the lock: %r" % (r.exc,)

    # ---- an exception in the body releases the lock ----
    for kind in ("read_lock", "write_lock"):
        lk = RWLock()
        try:
            with getattr(lk, kind)():
                raise KeyError("boom")
        except KeyError:
            pass

        def grab():
            with lk.write_lock():
                return 1
        g = _Bg(grab)
        g.finish(3, "write lock after an exception left the body of a %s block" % kind)
        assert g.res == 1

    # ---- stress: mutual exclusion and consistent data ----
    lk = RWLock()
    m = _th.Lock()
    st = {"r": 0, "w": 0, "a": 0, "b": 0, "maxr": 0, "reads": 0, "writes": 0}

    def reader(n):
        for _ in range(n):
            with lk.read_lock():
                with m:
                    st["r"] += 1
                    st["maxr"] = max(st["maxr"], st["r"])
                    assert st["w"] == 0, "a reader and a writer were inside at the same time"
                a = st["a"]
                _time.sleep(0)
                b = st["b"]
                assert a == b,"reader saw a half-finished write"
                with m:
                    assert st["w"] == 0, "a writer entered while a reader was inside"
                    st["r"] -= 1
                    st["reads"] += 1

    def writer(n):
        for _ in range(n):
            with lk.write_lock():
                with m:
                    assert st["r"] == 0, "a writer entered while %d reader(s) were inside" % st["r"]
                    assert st["w"] == 0, "two writers were inside at the same time"
                    st["w"] += 1
                st["a"] += 1
                _time.sleep(0)
                st["b"] += 1
                with m:
                    assert st["r"] == 0, "a reader entered while a writer was inside"
                    st["w"] -= 1
                    st["writes"] += 1
    _run_threads([lambda: reader(250) for _ in range(8)] + [lambda: writer(80) for _ in range(4)], what="reader/writer threads")
    assert st["reads"] == 2000 and st["writes"] == 320
    assert st["a"] == st["b"] == 320
    assert st["maxr"] > 1, "readers never overlapped"

    # ---- lean stress (no helper lock in the way): flags set inside the critical sections ----
    lk = RWLock()
    wflag = [0]
    inr = [0] * 12  # one slot per reader: 1 while inside (plain stores; the lock under test is the only guard)
    bad = []

    def lean_reader(k, n):
        for _ in range(n):
            with lk.read_lock():
                inr[k] = 1
                if wflag[0]:
                    bad.append("a reader and a writer were inside together")
                if wflag[0]:
                    bad.append("a reader and a writer were inside together")
                inr[k] = 0

    def lean_writer(n):
        for _ in range(n):
            with lk.write_lock():
                if wflag[0]:
                    bad.append("two writers inside")
                wflag[0] = 1
                for _ in range(3):
                    if any(inr):
                        bad.append("a writer was inside with a reader inside")
                wflag[0] = 0
    _run_threads([lambda k=k: lean_reader(k, 1500) for k in range(12)] + [lambda: lean_writer(500) for _ in range(4)], what="threads")
    assert not bad, bad[0]

    # ---- barrier-synchronised rounds: one writer and several readers arrive at the very same moment ----
    lk = RWLock()
    R = 800
    gate = _th.Barrier(9, timeout=8)
    wflag = [0]
    inr = [0] * 8
    bad = []

    def round_reader(k):
        for _ in range(R):
            gate.wait()
            with lk.read_lock():
                inr[k] = 1
                if wflag[0]:
                    bad.append("a reader and a writer were inside together")
                _time.sleep(0)
                if wflag[0]:
                    bad.append("a writer entered while a reader was inside")
                inr[k] = 0

    def round_writer():
        for _ in range(R):
            gate.wait()
            with lk.write_lock():
                wflag[0] = 1
                if any(inr):
                    bad.append("a writer was inside with a reader inside")
                _time.sleep(0)
                if any(inr):
                    bad.append("a reader came in while a writer was inside")
                wflag[0] = 0
    _run_threads([lambda k=k: round_reader(k) for k in range(8)] + [round_writer], timeout=10, what="round threads")
    assert not bad, bad[0]

    # ---- a steady stream of readers cannot starve a writer ----
    lk = RWLock()
    stop = []
    got = []

    def streamer():
        while not stop:
            with lk.read_lock():
                _time.sleep(0.002)

    def one_write():
        with lk.write_lock():
            got.append(1)
    rs = [_Bg(streamer) for _ in range(5)]
    _time.sleep(0.1)
    wb = _Bg(one_write)
    wb.wait(5)
    stop.append(1)
    for r in rs:
        r.finish(5, "streaming reader")
    assert got, "writer starved for 5 s by a stream of readers"
    wb.finish(2, "writer")

    # ---- many writers and readers with mixed bursts: nobody gets stuck ----
    lk = RWLock()
    cnt = [0]

    def mixed(k):
        for i in range(150):
            if (i + k) % 5 == 0:
                with lk.write_lock():
                    c = cnt[0]
                    _time.sleep(0)
                    cnt[0] = c + 1
            else:
                with lk.read_lock():
                    _ = cnt[0]
    _run_threads([lambda k=k: mixed(k) for k in range(16)], what="mixed threads")
    assert cnt[0] == 16 * 30, "lost updates under the write lock: %d" % cnt[0]


_hammer(_suite)
'''

