        passed = [[0] * R for _ in range(P)]   # thread t came out of wait() of round r
        idx = [[None] * R for _ in range(P)]
        acts_seen = []                         # (round, thread ident of action)
        last_thread = {}
        counter = [0]

        def action():
            r = counter[0]
            counter[0] += 1
            for t in range(P):
