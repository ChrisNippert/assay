id = "parallel-map"
prompt = '''
Write an order-preserving parallel map for Python threads. Define everything exactly as below; hidden tests run it with many workers and many items, with forced frequent thread switches, and check ordering, the worker limit, that every item is processed exactly once, error handling, and that no threads are left behind. Only the standard library is available. Don't use `concurrent.futures` or `multiprocessing.pool.ThreadPool`: build it from `threading` yourself. Reply with one Python code block.

**`parallel_map(func, items, workers=4)`** calls `func(item)` for every item of the iterable `items` (a list, tuple, generator… read it once, from start to end) using at most `workers` threads, and returns a list of the results in the same order as `items`. `workers` is an int >= 1 (otherwise raise `ValueError` before doing anything). An empty `items` returns `[]`. Every call of `func` runs in a worker thread, never in the caller's thread.

**Limit.** At no moment may more than `workers` calls of `func` be running at once, and when there is enough work, `workers` calls must really run at the same time (the tests make the calls wait for each other).

**Exactly once.** Each item is passed to `func` exactly once (no skipped and no duplicated items), as long as no call fails.

**Failures.** If a call of `func` raises, `parallel_map` stops starting new calls as soon as the failure is noticed, waits until every call that is already running has finished, and then raises the exception object from the failed call with the lowest item index (if several calls failed, that is the one for the item that comes first in `items`). When `parallel_map` returns or raises, no call of `func` is running any more, and none starts later.

**No leftovers.** `parallel_map` must not leave threads behind: shortly after it returns or raises, the threads it started must have ended (no pool that outlives the call). Threads must not be left blocked forever, whatever `func` raises. Calls to `parallel_map` can come from several threads at once, each with its own workers.
'''
tests = '''
import sys as _sys
import threading as _th
import time as _time

_si_saved = _sys.getswitchinterval()


def _run_threads(fns, timeout=10.0, what="threads"):
    """Run each callable in its own daemon thread; fail on deadlock; re-raise the first error."""
    errs = []

    def wrap(f):
        def g():
            try:
                f()
            except BaseException as e:
                errs.append(e)
        return g

    ts = [_th.Thread(target=wrap(f), daemon=True) for f in fns]
    for t in ts:
        t.start()
    end = _time.monotonic() + timeout
    for t in ts:
        t.join(max(0.0, end - _time.monotonic()))
    stuck = sum(t.is_alive() for t in ts)
    assert not stuck, "DEADLOCK or lost wake-up: %d of %d %s still blocked after %.0f s" % (stuck, len(ts), what, timeout)
    if errs:
        raise errs[0]


class _Bg:
    """Runs f() in a daemon thread; .wait(t) joins; .alive, .res, .exc."""

    def __init__(self, f):
        self.res = None
        self.exc = None

        def g():
            try:
                self.res = f()
            except BaseException as e:
                self.exc = e
        self._t = _th.Thread(target=g, daemon=True)
        self._t.start()

    def wait(self, t):
        self._t.join(t)
        return not self._t.is_alive()

    @property
    def alive(self):
        return self._t.is_alive()

    def finish(self, t=5.0, what="call"):
        assert self.wait(t), "%s is still blocked after %.0f s (deadlock, lost wake-up or ignored wake-up)" % (what, t)
        return self


def _raises(exc, f, what="call"):
    try:
        f()
    except exc as e:
        return e
    except BaseException as e:
        raise AssertionError("%s raised %r, expected %s" % (what, e, exc.__name__))
    raise AssertionError("%s did not raise %s" % (what, exc.__name__))


def _hammer(suite):
    _sys.setswitchinterval(1e-6)
    _stack_saved = _th.stack_size()
    try:
        _th.stack_size(512 * 1024)  # many threads must fit in the 1 GB address-space limit
    except (ValueError, RuntimeError):
        pass
    try:
        suite()
    finally:
        _sys.setswitchinterval(_si_saved)
        try:
            _th.stack_size(_stack_saved)
        except (ValueError, RuntimeError):
            pass


class _Noise:
    """Context manager: n busy threads that compete for the interpreter, so thread switches happen at nearly every call."""

    def __init__(self, n=2):
        self.n = n
        self.stop = False

    def _spin(self):
        while not self.stop:
            pass

    def __enter__(self):
        for _ in range(self.n):
            _th.Thread(target=self._spin, daemon=True).start()
        return self

    def __exit__(self, *a):
        self.stop = True


def _suite():
    main_thread = _th.main_thread()

    def pm(*a, **k):
        b = _Bg(lambda: parallel_map(*a, **k))
        b.finish(10, "parallel_map")
        if b.exc is not None:
            raise b.exc
        return b.res

    def slow_gen(n):
        for i in range(n):
            _time.sleep(0)
            yield i

    # ---- basics ----
    assert pm(lambda x: x * x, range(30), 4) == [x * x for x in range(30)]
    assert pm(lambda x: x, [], 3) == []
    assert pm(lambda x: x + 1, (5,), 8) == [6]
    assert pm(lambda x: x, iter("abc"), workers=2) == ["a", "b", "c"]
    assert pm(str, [1, 2, 3]) == ["1", "2", "3"]
    for bad in (0, -1):
        called = []
        _raises(ValueError, lambda: parallel_map(called.append, [1, 2], workers=bad), "parallel_map with workers=%d" % bad)
        assert not called
    where = []
    pm(lambda x: where.append(_th.current_thread()), range(10), 3)
    assert len(where) == 10 and all(t is not main_thread for t in where), "func must run in worker threads, not the caller's thread"

    # ---- the limit, and really that many at once ----
    for workers, nitems in ((4, 4), (3, 9), (6, 6)):
        bar = _th.Barrier(workers, timeout=5)

        def meet(x):
            if x < workers:
                bar.wait()
            return x
        try:
            out = pm(meet, range(nitems), workers)
        except _th.BrokenBarrierError:
            raise AssertionError("fewer than %d calls ran at the same time with workers=%d" % (workers, workers))
        assert out == list(range(nitems))
    m = _th.Lock()
    cur = [0]
    peak = [0]

    def watch(x):
        with m:
            cur[0] += 1
            peak[0] = max(peak[0], cur[0])
            assert cur[0] <= 5, "%d calls of func at once with workers=5" % cur[0]
        _time.sleep(0.001)
        with m:
            cur[0] -= 1
        return x * 2
    assert pm(watch, range(150), 5) == [x * 2 for x in range(150)]
    assert peak[0] == 5, "peak concurrency was %d, expected 5" % peak[0]

    # ---- order is the input order, not the completion order ----
    def jitter(i):
        _time.sleep(((i * 7919) % 5) * 0.001)
        return -i
    assert pm(jitter, range(120), 8) == [-i for i in range(120)]
    # the first item finishes last
    assert pm(lambda i: (_time.sleep(0.2) if i == 0 else None) or i, range(12), 4) == list(range(12))

    # ---- each item exactly once, also from a generator being read by many threads ----
    for rep in range(4):
        n = 1500
        calls = [0] * n

        def count(i):
            calls[i] += 1
            return i
        src = slow_gen(n) if rep % 2 else range(n)
        out = pm(count, src, 12)
        assert out == list(range(n)), "wrong results (items skipped, duplicated or reordered)"
        assert calls == [1] * n, "an item was passed to func %d times" % max(calls)

    # ---- failures ----
    started = [0]
    running = [0]
    mm = _th.Lock()

    def failing(i):
        with mm:
            started[0] += 1
            running[0] += 1
        try:
            if i == 3:
                raise ValueError("bad item 3")
            _time.sleep(0.005)
            return i
        finally:
            with mm:
                running[0] -= 1
    e = _raises(ValueError, lambda: pm(failing, range(400), 4), "parallel_map with a failing item")
    assert str(e) == "bad item 3"
    assert running[0] == 0, "parallel_map raised while %d calls of func were still running" % running[0]
    s1 = started[0]
    _time.sleep(0.15)
    assert started[0] == s1, "func calls were started after parallel_map had raised"
    assert s1 < 80, "%d of 400 items were still started after a failure (no new calls should start once a failure is noticed)" % s1

    # the failing item with the lowest index wins, even if another failure arrives first
    for slow_first in (False, True):
        errA, errB = KeyError("A"), IndexError("B")
        bar = _th.Barrier(2, timeout=5)

        def two(i):
            if i in (0, 1):
                bar.wait()
                if i == 0:
                    if slow_first:
                        _time.sleep(0.15)
                    raise errA
                raise errB
            return i
        try:
            got = _raises(BaseException, lambda: pm(two, range(6), 2), "parallel_map with two failures")
        except AssertionError:
            raise
        assert got is errA, "expected the exception of the lowest failing index (0), got %r" % (got,)

    # a failure in a generator-fed run
    e = _raises(ZeroDivisionError, lambda: pm(lambda x: 1 // (x - 40), slow_gen(100), 6))
    # everything still works afterwards
    assert pm(lambda x: x, range(20), 6) == list(range(20))

    # ---- no threads left behind ----
    base = _th.active_count()
    for k in range(40):
        if k % 4 == 3:
            _raises(RuntimeError, lambda: pm(lambda x: (_ for _ in ()).throw(RuntimeError("x")) if x == 2 else x, range(10), 5))
        else:
            pm(lambda x: x, range(10), 5)
        for _ in range(100):
            if _th.active_count() <= base:
                break
            _time.sleep(0.01)
        assert _th.active_count() <= base, "threads left behind after call %d: %d alive, %d before" % (k, _th.active_count(), base)

    # ---- several callers at once ----
    results = {}

    def caller(c):
        for r in range(15):
            data = list(range(c, c + 40))
            out = parallel_map(lambda x: x * 3 + c, data, workers=3)
            assert out == [x * 3 + c for x in data], "caller %d got wrong results" % c
        results[c] = True
    _run_threads([lambda c=c: caller(c) for c in range(6)], timeout=15, what="callers")
    assert len(results) == 6

    # ---- many small maps with many workers: nothing is lost ----
    def small():
        for r in range(60):
            xs = list(range(r % 17))
            assert parallel_map(lambda x: x + 1, xs, workers=16) == [x + 1 for x in xs]
    _run_threads([small, small, small], timeout=15, what="threads")


_hammer(_suite)
'''

