    el = _time.monotonic() - t0
    assert 0.12 <= el < 3, "result(timeout=0.15) took %.3f s" % el
    assert f.set_result(5) is None and f.done()
    assert f.result() == 5 and f.result(timeout=0) == 5 and f.exception() is None
    _raises(InvalidStateError, lambda: f.set_result(6))
    _raises(InvalidStateError, lambda: f.set_exception(ValueError()))
    assert f.result() == 5
    g = Future()
    err = KeyError("nope")
    g.set_exception(err)
    assert g.done() and g.exception() is err
    assert _raises(KeyError, lambda: g.result()) is err
    _raises(InvalidStateError, lambda: g.set_result(1))
    assert _raises(KeyError, lambda: g.result()) is err

    # ---- callbacks, single-threaded ----
    log = []
    f = Future()
    me = _th.get_ident()
    for i in range(5):
        f.add_done_callback(lambda fut, i=i: log.append((i, fut is f, fut.done(), fut.result(), _th.get_ident())))
    assert log == []
    f.set_result("v")
    assert [x[0] for x in log] == [0, 1, 2, 3, 4], "callbacks must run in registration order, before set_result returns"
    assert all(x[1:4] == (True, True, "v") for x in log)
    f.add_done_callback(lambda fut: log.append(("late", _th.get_ident())))
    assert log[-1] == ("late", me), "a callback added to a finished future must run at once, in the caller"
    # callbacks run in the completing thread
    f = Future()
    ids = []
    f.add_done_callback(lambda fut: ids.append(_th.get_ident()))
    b = _Bg(lambda: f.set_result(1))
    b.finish(5)
    assert ids == [b._t.ident], "callback must run in the thread that completed the future"
    # a raising callback
    f = Future()
    calls = []

    def bad(fut):
        calls.append("bad")
        raise RuntimeError("callback failed")
    f.add_done_callback(lambda fut: calls.append(1))
    f.add_done_callback(bad)
    f.add_done_callback(lambda fut: calls.append(2))
    f.set_result(0)
    assert calls == [1, "bad", 2], "a raising callback must not stop the others or propagate: %r" % (calls,)
    f.add_done_callback(bad)
    assert calls[-1] == "bad"
    f = Future()
    f.set_exception(ValueError("x"))
    f.add_done_callback(lambda fut: calls.append(fut.exception()))
    assert isinstance(calls[-1], ValueError)

    # ---- callbacks may use the future: no lock held while they run ----
    f = Future()
    seen = []

    def reenter(fut):
        seen.append(fut.result())
        seen.append(fut.done())
        fut.add_done_callback(lambda x: seen.append("inner"))
        seen.append(fut.exception())
    f.add_done_callback(reenter)
    s = _Bg(lambda: f.set_result(42))
    s.finish(5, "set_result with a callback that calls back into the future")
    assert s.exc is None and seen == [42, True, "inner", None], seen
    # a chain of futures, each completed from the previous one's callback
    fs = [Future() for _ in range(300)]
    for i in range(299):
        fs[i].add_done_callback(lambda fut, i=i: fs[i + 1].set_result(fut.result() + 1))
    s = _Bg(lambda: fs[0].set_result(0))
    s.finish(5, "chain of futures")
    assert s.exc is None and fs[-1].result(timeout=1) == 299

    # ---- waiters: all of them wake up, with the value ----
    f = Future()
    ws = [_Bg(lambda: f.result()) for _ in range(12)] + [_Bg(lambda: f.exception()) for _ in range(4)]
    _time.sleep(0.25)
    assert all(w.alive for w in ws), "result() returned before the future was complete"
    f.set_result("go")
    for w in ws:
        w.finish(5, "waiter of a completed future")
    assert [w.res for w in ws] == ["go"] * 12 + [None] * 4
    f = Future()
    ws = [_Bg(lambda: f.result()) for _ in range(6)]
    _time.sleep(0.15)
    f.set_exception(err)
    for w in ws:
        w.finish(5, "waiter of a failed future")
        assert w.exc is err
    f = Future()
    w = _Bg(lambda: f.result(timeout=5))
    _time.sleep(0.1)
    f.set_result(3)
    w.finish(3, "waiter with a timeout")
    assert w.res == 3

    # ---- completion races: exactly one winner ----
    def race(i):
        f = Future()
        gate = _th.Barrier(8, timeout=5)
        outcome = []

        def setter(k):
            gate.wait()
            try:
                if k % 3 == 0:
                    f.set_exception(ValueError(k))
                else:
                    f.set_result(k)
                outcome.append(("ok", k))
            except InvalidStateError:
                outcome.append(("late", k))
        _run_threads([lambda k=k: setter(k) for k in range(8)], timeout=8, what="setters")
        wins = [k for s, k in outcome if s == "ok"]
        assert len(wins) == 1, "%d threads completed the same future: %r" % (len(wins), wins)
        k = wins[0]
        if k % 3 == 0:
            assert isinstance(f.exception(), ValueError) and f.exception().args == (k,)
        else:
            assert f.result() == k
    for i in range(400):
        race(i)

    # ---- callbacks registered while the future completes: exactly once each ----
    def _registered_while_completing():
        N = 250
        futs = [Future() for _ in range(N)]
        counts = [[0] * 5 for _ in range(N)]
        oks = [True] * N
        gate = _th.Barrier(5, timeout=8)

        def mk(i, j):
            def cb(fut):
                counts[i][j] += 1
                if not (fut.done() and fut.result() == i):
                    oks[i] = False
            return cb

        def completer():
            for i in range(N):
                gate.wait()
                futs[i].set_result(i)

        def adder(j):
            for i in range(N):
                gate.wait()
                if j % 2:
                    _time.sleep(0)
                futs[i].add_done_callback(mk(i, j))
        _run_threads([completer] + [lambda j=j: adder(j) for j in range(1, 5)], timeout=9, what="completer and adders")
        for i in range(N):
            assert counts[i][1:] == [1, 1, 1, 1], "callbacks of future %d ran %r times (should be once each)" % (i, counts[i][1:])
            assert oks[i], "a callback ran before the result was visible"

    for _round in range(4):
        _registered_while_completing()

    # ---- lots of waiters, completers and callbacks mixed ----
    M = 80
    futs = [Future() for _ in range(M)]
    total = [0] * M
    got = [[] for _ in range(M)]

    def waiter(k):
        for i in range(M):
            got[i].append(futs[i].result(timeout=8))

    def cbadd():
        for i in range(M):
            futs[i].add_done_callback(lambda fut, i=i: total.__setitem__(i, total[i] + 1))

    def comp():
        for i in range(M):
            futs[i].set_result(i * 7)
    _run_threads([lambda k=k: waiter(k) for k in range(10)] + [cbadd, cbadd, comp], timeout=10, what="mixed threads")
    assert all(g == [i * 7] * 10 for i, g in enumerate(got))
    assert total == [2] * M, "callbacks counted %r" % (total[:6],)


_hammer(_suite)
'''

[[questions]]
id = "token-bucket"
prompt = '''
Write a thread-safe token-bucket rate limiter whose clock can be replaced, so that it can be tested without sleeping. Define everything exactly as below; hidden tests drive it with a fake clock, first one thread at a time and then from many threads with forced frequent thread switches, and check that exactly the right number of tokens is ever handed out. Only the standard library is available. Reply with one Python code block.

**`TokenBucket(rate, capacity, clock=time.monotonic)`**: `rate` is the number of tokens added per second (a number > 0), `capacity` is the most tokens the bucket can hold (a number > 0), and `clock` is a function with no arguments that returns the current time in seconds as a float (the tests pass their own). Anything else raises `ValueError`. The bucket starts full, and reads `clock()` once in the constructor to learn the starting time.

**Refilling.** Tokens accrue continuously and fractionally: when the clock has advanced by `dt` seconds since the last reading that counted, `rate * dt` tokens are added, never above `capacity`. Fractions are kept (at rate 2 per second, four steps of 0.25 s add up to exactly one token), and nothing is lost when a step is too small to give a whole token. The bucket only ever reads the clock to refill (so every method below calls `clock()` at least once, and always before looking at the token count). If the clock reads earlier than the latest time seen so far, no time has passed: no tokens are added or removed, and the latest time seen is not moved backwards.

**`try_acquire(n=1)`** takes `n` tokens if the bucket holds at least `n` (after refilling) and returns `True`; otherwise it takes nothing, returns `False` and never blocks. All or nothing: `try_acquire(3)` with 2.5 tokens leaves 2.5 tokens. `n` must be a number with `0 < n <= capacity`, otherwise `ValueError` (before anything else happens).

**`available()`** returns the current number of tokens as a float (after refilling). **`wait_time(n=1)`** returns how many seconds from now until `n` tokens will be available if nothing else is taken, as a float: `0.0` if they are available now. (`n` is checked as in `try_acquire`.)

**Guarantees.** Many threads may call any method at the same time. Tokens are never handed out twice and never created from nothing: if the bucket is empty at time `t0` and the clock then runs to `t1`, all threads together can take at most `rate * (t1 - t0)` tokens (up to the capacity), and every token that has accrued and was not handed out is still in the bucket. Calls from several threads may read the clock in a different order than they take effect; the clock must still never make tokens appear twice.
'''
tests = '''
import sys as _sys
import threading as _th
import time as _time

_si_saved = _sys.getswitchinterval()


def _run_threads(fns, timeout=10.0, what="threads"):
    """Run each callable in its own daemon thread; fail on deadlock; re-raise the first error."""
    errs = []

    def wrap(f):
        def g():
            try:
                f()
            except BaseException as e:
                errs.append(e)
        return g

    ts = [_th.Thread(target=wrap(f), daemon=True) for f in fns]
    for t in ts:
        t.start()
    end = _time.monotonic() + timeout
    for t in ts:
        t.join(max(0.0, end - _time.monotonic()))
    stuck = sum(t.is_alive() for t in ts)
    assert not stuck, "DEADLOCK or lost wake-up: %d of %d %s still blocked after %.0f s" % (stuck, len(ts), what, timeout)
    if errs:
        raise errs[0]


class _Bg:
    """Runs f() in a daemon thread; .wait(t) joins; .alive, .res, .exc."""

    def __init__(self, f):
        self.res = None
        self.exc = None

        def g():
            try:
                self.res = f()
            except BaseException as e:
                self.exc = e
        self._t = _th.Thread(target=g, daemon=True)
        self._t.start()

    def wait(self, t):
        self._t.join(t)
        return not self._t.is_alive()

    @property
    def alive(self):
        return self._t.is_alive()

    def finish(self, t=5.0, what="call"):
        assert self.wait(t), "%s is still blocked after %.0f s (deadlock, lost wake-up or ignored wake-up)" % (what, t)
        return self


def _raises(exc, f, what="call"):
    try:
        f()
    except exc as e:
        return e
    except BaseException as e:
        raise AssertionError("%s raised %r, expected %s" % (what, e, exc.__name__))
    raise AssertionError("%s did not raise %s" % (what, exc.__name__))


def _hammer(suite):
    _sys.setswitchinterval(1e-6)
    _stack_saved = _th.stack_size()
    try:
        _th.stack_size(512 * 1024)  # many threads must fit in the 1 GB address-space limit
    except (ValueError, RuntimeError):
        pass
    try:
        suite()
    finally:
        _sys.setswitchinterval(_si_saved)
        try:
            _th.stack_size(_stack_saved)
        except (ValueError, RuntimeError):
            pass


class _Noise:
    """Context manager: n busy threads that compete for the interpreter, so thread switches happen at nearly every call."""

    def __init__(self, n=2):
        self.n = n
        self.stop = False

    def _spin(self):
        while not self.stop:
            pass

    def __enter__(self):
        for _ in range(self.n):
            _th.Thread(target=self._spin, daemon=True).start()
        return self

    def __exit__(self, *a):
        self.stop = True


def _suite():
    import random as _rnd

    class Clock:
        """A fake clock; thread-safe; optionally moves forward by `step` on every reading."""

        def __init__(self, t=1000.0, step=0.0):
            self.t = t
            self.step = step
            self.reads = 0
            self._m = _th.Lock()

        def __call__(self):
            with self._m:
                self.reads += 1
                v = self.t
                self.t += self.step
                return v

        def advance(self, dt):
            with self._m:
                self.t += dt

    # ---- construction ----
    ck = Clock()
    for args in ((0, 5), (-1, 5), (2, 0), (2, -3), ("x", 5)):
        _raises(ValueError, lambda: TokenBucket(*args, clock=ck), "TokenBucket%r" % (args,))
    tb = TokenBucket(2, 10, ck)
    assert ck.reads == 1, "the constructor must read the clock once"
    for n in (0, -1, 11):
        _raises(ValueError, lambda: tb.try_acquire(n), "try_acquire(%r)" % n)
        _raises(ValueError, lambda: tb.wait_time(n), "wait_time(%r)" % n)

    # ---- single-threaded arithmetic (all numbers exact in binary floating point) ----
    ck = Clock()
    tb = TokenBucket(2, 10, ck)
    assert tb.available() == 10.0 and isinstance(tb.available(), float)
    assert tb.try_acquire(4) is True and tb.available() == 6.0
    assert tb.try_acquire(7) is False and tb.available() == 6.0, "a refused try_acquire must take nothing"
    assert tb.try_acquire(6) is True and tb.available() == 0.0
    assert tb.try_acquire() is False
    assert tb.wait_time() == 0.5 and tb.wait_time(3) == 1.5 and tb.wait_time(10) == 5.0
    ck.advance(1.0)
    assert tb.available() == 2.0
    assert tb.try_acquire(2) is True and tb.try_acquire(1) is False
    for _ in range(4):
        ck.advance(0.25)
    assert tb.available() == 2.0, "fractions of a token must not be lost: %r" % tb.available()
    assert tb.wait_time(2) == 0.0 and tb.wait_time(3) == 0.5
    ck.advance(100)
    assert tb.available() == 10.0, "the bucket must not hold more than its capacity"
    assert tb.wait_time(10) == 0.0
    # fractional tokens and all-or-nothing
    ck = Clock()
    tb = TokenBucket(4, 3, ck)
    assert tb.try_acquire(3) is True
    ck.advance(0.625)  # 2.5 tokens
    assert tb.try_acquire(3) is False and tb.available() == 2.5
    assert tb.try_acquire(2.5) is True and tb.available() == 0.0
    # the clock going backwards
    ck = Clock(500.0)
    tb = TokenBucket(2, 10, ck)
    assert tb.try_acquire(10)
    ck.t = 400.0
    assert tb.available() == 0.0, "a clock that went backwards must not add or remove tokens"
    ck.t = 500.5
    assert tb.available() == 1.0, "the latest time seen (500) must stay the reference: got %r" % tb.available()
    ck.t = 450.0
    assert tb.available() == 1.0
    ck.t = 501.0
    assert tb.available() == 2.0
    # every method reads the clock
    ck = Clock()
    tb = TokenBucket(1, 5, ck)
    r0 = ck.reads
    tb.available()
    tb.try_acquire()
    tb.wait_time()
    assert ck.reads >= r0 + 3

    # ---- a frozen clock, many threads: exactly `capacity` tokens are handed out ----
    def hammer_frozen(nthreads, sizes, per):
        ck = Clock()
        tb = TokenBucket(4, 100, ck)
        granted = [0] * nthreads
        gate = _th.Barrier(nthreads, timeout=6)

        def worker(k):
            r = _rnd.Random(k)
            gate.wait()
            for _ in range(per):
                n = r.choice(sizes)
                if tb.try_acquire(n):
                    granted[k] += n
        total = 0
        for phase, add in enumerate((0.0, 12.5, 6.25)):
            ck.advance(add)
            granted[:] = [0] * nthreads
            gate.reset()
            _run_threads([lambda k=k: worker(k) for k in range(nthreads)], timeout=9, what="threads")
            total = sum(granted)
            while tb.try_acquire(1):  # drain the leftovers (all asks above were refused, so < max(sizes) tokens are left)
                total += 1
            expect = (100, 50, 25)[phase]
            assert total == expect, "phase %d: %d tokens were handed out, the bucket held exactly %d" % (phase, total, expect)
            assert tb.available() < 1

    hammer_frozen(32, (1,), 40)
    hammer_frozen(24, (1, 2, 3), 60)
    hammer_frozen(16, (1,), 120)

    # ---- a clock that moves on every reading: tokens are conserved ----
    for rep in range(3):
        ck = Clock(2000.0, step=0.25)
        tb = TokenBucket(4, 1000, ck)  # 4/s * 0.25 s = one token per clock reading
        assert tb.try_acquire(1000)
        base = ck.t - 0.25  # the time of the latest reading so far
        granted = [0] * 24
        gate = _th.Barrier(24, timeout=6)

        def spend(k):
            gate.wait()
            for _ in range(250):
                if tb.try_acquire(1):
                    granted[k] += 1
        _run_threads([lambda k=k: spend(k) for k in range(24)], timeout=9, what="threads")
        left = tb.available()
        credited = (ck.t - 0.25 - base) * 4  # the final available() read the clock at ck.t - 0.25 (== the latest time seen)
        total = sum(granted)
        assert total + left == credited, "tokens were not conserved: %d handed out + %.2f left, but %.2f accrued" % (total, left, credited)
        assert total <= credited

    # ---- wait_time is consistent with try_acquire ----
    ck = Clock()
    tb = TokenBucket(5, 20, ck)
    assert tb.try_acquire(20)
    w = tb.wait_time(7)
    assert w == 1.4
    ck.advance(w - 0.1)
    assert not tb.try_acquire(7)
    ck.advance(0.11)
    assert tb.try_acquire(7)


_hammer(_suite)
