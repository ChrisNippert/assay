- Callbacks may do anything with the future: call `result()` or `done()` on it, call `add_done_callback` on it again, complete other futures, and so on. Nothing may deadlock, so no internal lock may be held while a callback runs.

**Guarantees.** Many threads may call any method at the same time. Waiting threads must sleep, not spin, and every waiter is woken when the future completes.
