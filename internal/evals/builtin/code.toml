name = "Code reading"
description = "What does this Python program print? Tests careful reading of real semantics: aliasing, scope, slicing, generators."
check = "exact"

[[questions]]
id = "alias"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
x = [1, 2, 3]
y = x
y += [4]
print(len(x))
```'''
answer = '''4'''

[[questions]]
id = "default-arg"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
def f(a, b=[]):
    b.append(a)
    return len(b)

f(1)
f(2)
print(f(3))
```'''
answer = '''3'''

[[questions]]
id = "genexpr"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
print(sum(i * i for i in range(10) if i % 3 == 1))
```'''
answer = '''66'''

