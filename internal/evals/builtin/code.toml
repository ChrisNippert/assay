[[questions]]
id = "memo"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
def fib(n, memo={}):
    if n < 2:
        return n
    if n not in memo:
        memo[n] = fib(n - 1) + fib(n - 2)
    return memo[n]

print(fib(30) % 1000)
```'''
answer = '''40'''

