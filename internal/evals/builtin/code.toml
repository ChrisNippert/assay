[[questions]]
id = "word-count"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
d = {}
for w in "the cat and the hat and the bat".split():
    d[w] = d.get(w, 0) + 1
print(max(d, key=d.get), d["and"])
```'''
answer = '''the 2'''

[[questions]]
id = "sort"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
a = [3, 1, 2]
b = sorted(a)
a.sort(reverse=True)
print(a[0] - b[0], b)
```'''
answer = '''2 [1, 2, 3]'''

[[questions]]
id = "nonlocal"
prompt = '''
What does this Python 3 program print? Give the exact output.

```python
x = 10

def g():
    x = 5
    def h():
        nonlocal x
        x += 1
        return x
    return h() + x

print(g(), x)
```'''
answer = '''12 10'''

